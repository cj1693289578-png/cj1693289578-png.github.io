<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14102e">
<title>仙门大掌柜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0a1e;color:#f4ecd8;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
:root{--gold:#ffd36b;--gold2:#c9953a;--jade:#5ee6b0;--red:#e0483f;--ink:#1a1536;--panel:#272048}
#rot{position:fixed;inset:0;z-index:99;background:#14102e;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:22px;font-weight:900;text-align:center;color:#fff}#rot i{font-size:56px;font-style:normal}
@media (orientation:landscape) and (max-height:520px){#rot{display:flex}}
#buff{position:absolute;left:8px;top:8px;z-index:5;padding:5px 12px;border-radius:99px;font-weight:900;font-size:14px;color:#5a3000;background:linear-gradient(#ffe98a,#ffb52e);box-shadow:0 3px 0 #a86a00,0 0 14px rgba(255,200,60,.8);display:none;pointer-events:none}#buff.on{display:block;animation:pulse 1s infinite}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:#14102e}
.scr{position:absolute;inset:0;display:none;overflow:hidden}.scr.on{display:block}
.serif{font-family:"Noto Serif CJK SC","Songti SC","STKaiti","KaiTi","SimSun",serif}
.btn{border:0;font:inherit;font-weight:900;cursor:pointer;color:#4a2b00;background:linear-gradient(#ffe9a0,#f2b53a);border-radius:12px;padding:12px 28px;font-size:20px;box-shadow:0 4px 0 #9a6410,0 8px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .08s,box-shadow .08s;position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6410,0 3px 6px rgba(0,0,0,.4)}
.btn.jade{background:linear-gradient(#a8ffe0,#2fbf8b);color:#05382a;box-shadow:0 4px 0 #17795a,0 8px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.red{background:linear-gradient(#ff9a8f,#d13c32);color:#fff;box-shadow:0 4px 0 #7f1a14,0 8px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.dark{background:linear-gradient(#4a3f7a,#342b5e);color:#f0e6c8;box-shadow:0 4px 0 #1b1536,0 6px 12px rgba(0,0,0,.4)}
.btn.sm{font-size:15px;padding:9px 16px;border-radius:10px}
.btn[disabled]{filter:grayscale(.9) brightness(.7);pointer-events:none}
/* title */
#title canvas{position:absolute;inset:0;width:100%;height:100%}
.tlogo{position:absolute;top:12%;left:0;right:0;text-align:center}
.tlogo .t1{font-size:15px;letter-spacing:8px;color:#ffe9a8;text-shadow:0 2px 8px #000}
.tlogo h1{margin:10px 0 0;font-size:74px;line-height:1.05;letter-spacing:4px;font-weight:900;background:linear-gradient(#fff6c8 10%,#ffd36b 45%,#d9892b 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b3a0a) drop-shadow(0 8px 18px rgba(0,0,0,.6));animation:float 3.2s ease-in-out infinite}
.tlogo .t2{margin-top:18px;font-size:17px;color:#fff;text-shadow:0 2px 6px #000;letter-spacing:3px}
@keyframes float{50%{transform:translateY(-8px)}}
.tbtn{position:absolute;bottom:12%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:16px}
.tbtn .btn.big{font-size:28px;padding:16px 56px;border-radius:16px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.tinfo{font-size:14px;color:#ffe9a8;text-shadow:0 1px 4px #000;min-height:20px}
.tfoot{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.7)}
/* main */
#main{display:none;flex-direction:column;background:linear-gradient(#14102e,#1c1840)}
#main.on{display:flex}
#top{position:relative;padding:calc(8px + env(safe-area-inset-top)) 12px 6px;background:linear-gradient(#0d0a22,rgba(13,10,34,.8));z-index:3;flex:none}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ibtn{width:38px;height:38px;border-radius:50%;border:0;color:#ffe9a8;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,211,107,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font:inherit}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:18px;height:18px;fill:currentColor}
.sect{text-align:center;line-height:1.15}
.sect b{font-size:17px;letter-spacing:3px;color:var(--gold)}
.sect small{display:block;font-size:12px;color:#c9bfe8}
.coinrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
.coinrow svg{width:28px;height:28px}
#coins{font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 0 #6b3a0a,0 0 14px rgba(255,211,107,.6);letter-spacing:1px;font-variant-numeric:tabular-nums}
#coins.bump{animation:cbump .18s}
@keyframes cbump{50%{transform:scale(1.08)}}
.subrow{display:flex;justify-content:center;gap:14px;font-size:13px;color:#cfc4ee}
.subrow b{color:var(--jade)}
.subrow .k b{color:#ff9ee0}
#sceneWrap{position:relative;flex:none;height:232px;margin:0;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.5);touch-action:none}
#scv{width:100%;height:100%;display:block;touch-action:none}
#combo{position:absolute;left:10px;bottom:8px;font-size:15px;font-weight:900;color:#fff;text-shadow:0 2px 0 #7a1fa8,0 0 8px #ff9ee0;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo i{display:block;height:5px;margin-top:3px;border-radius:3px;background:linear-gradient(90deg,#ff9ee0,#ffd36b);width:0}
#tapval{position:absolute;right:10px;bottom:8px;font-size:12px;color:#e8ddff;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:99px}
#tut{flex:none;margin:8px 10px 0;padding:8px 12px;border-radius:12px;background:linear-gradient(#5a3dbd,#3c2a8a);box-shadow:0 0 0 2px #ffd36b,0 4px 12px rgba(0,0,0,.4);font-size:14px;font-weight:700;display:none;align-items:center;gap:8px;animation:tutin .4s}
#tut.on{display:flex}
#tut .f{font-size:22px;animation:poke .8s infinite}
@keyframes poke{50%{transform:translateY(5px)}}
@keyframes tutin{from{transform:translateY(-10px);opacity:0}}
#panes{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px 12px;display:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.on{display:block}
.buybar{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.buybar span{font-size:13px;color:#c9bfe8;margin-right:2px}
.buybar button{flex:1;border:0;border-radius:9px;padding:7px 0;font:inherit;font-weight:800;font-size:14px;color:#cfc4ee;background:#2b2455;box-shadow:inset 0 0 0 1.5px #4b3f86;cursor:pointer}
.buybar button.on{color:#4a2b00;background:linear-gradient(#ffe9a0,#f2b53a);box-shadow:none}
.card{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:9px;border-radius:14px;background:linear-gradient(#2f2759,#241d47);box-shadow:inset 0 0 0 1.5px rgba(255,211,107,.28),0 3px 8px rgba(0,0,0,.35);position:relative}
.card.locked{opacity:.55;filter:grayscale(.6)}
.card .ico{width:54px;height:54px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--gold2),0 3px 6px rgba(0,0,0,.5)}
.card .ico canvas{width:100%;height:100%;display:block}
.card .mid{flex:1;min-width:0}
.card .nm{font-weight:900;font-size:16px;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.card .nm small{font-size:12px;color:var(--jade);font-weight:800}
.card .desc{font-size:12px;color:#bdb2dd;margin-top:1px;line-height:1.35}
.bar{position:relative;height:18px;border-radius:9px;background:#120e29;box-shadow:inset 0 0 0 1.5px #4b3f86;overflow:hidden;margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#8bffd0,#2fbf8b);border-radius:9px}
.bar i.auto{background:linear-gradient(#ffe9a0,#f2b53a)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.ms{margin-top:3px;display:flex;gap:3px;align-items:center;font-size:11px;color:#a89ccc}
.ms em{width:14px;height:5px;border-radius:3px;background:#3a3066;display:inline-block}
.ms em.on{background:linear-gradient(90deg,#ffd36b,#ff9ee0)}
.buy{flex:none;width:92px;border:0;border-radius:12px;padding:7px 4px;font:inherit;color:#4a2b00;font-weight:900;background:linear-gradient(#ffe9a0,#f2b53a);box-shadow:0 3px 0 #9a6410,inset 0 1px 0 rgba(255,255,255,.7);cursor:pointer;line-height:1.2}
.buy b{display:block;font-size:14px}
.buy span{display:block;font-size:12px;font-weight:800}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6410}
.buy.no{background:linear-gradient(#58507d,#41396a);color:#9b92c4;box-shadow:0 3px 0 #1d1738}
.buy.done{background:linear-gradient(#a8ffe0,#2fbf8b);color:#05382a;box-shadow:0 3px 0 #17795a}
.buy.claim{background:linear-gradient(#ff9ee0,#c94fc0);color:#fff;box-shadow:0 3px 0 #7a1f78;animation:pulse 1s infinite}
.hl{animation:hl 1s ease-in-out infinite;position:relative;z-index:2}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 rgba(255,211,107,.9)}50%{box-shadow:0 0 0 8px rgba(255,211,107,0)}}
.buy.hl,.nav button.hl{animation:hl 1s ease-in-out infinite}
.h-sec{font-size:13px;color:#bdb2dd;margin:6px 2px 8px;display:flex;justify-content:space-between}
.ups-empty{text-align:center;color:#8f84b8;font-size:13px;padding:14px}
.prog{height:8px;border-radius:4px;background:#120e29;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#ff9ee0,#ffd36b)}
.nav{flex:none;display:flex;background:linear-gradient(#0d0a22,#07051a);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.5);z-index:3}
.nav button{flex:1;border:0;background:none;font:inherit;color:#9e93c8;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:12px;position:relative;cursor:pointer}
.nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--gold);background:rgba(255,211,107,.12)}
.nav .dot{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:8px;background:#ff3d6e;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #07051a}
.nav .dot.on{display:flex}
/* ascend pane */
.asc{text-align:center}
.asc .big{font-size:42px;font-weight:900;color:#ff9ee0;text-shadow:0 3px 0 #5a1f6e,0 0 18px rgba(255,158,224,.6)}
.asc .info{background:rgba(255,255,255,.07);border-radius:14px;padding:12px;margin:10px 0;font-size:14px;line-height:1.7;text-align:left}
.asc .info b{color:var(--gold)}
.asc .orb{width:96px;height:96px;margin:6px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff9ee0 35%,#7a3fd0 80%);box-shadow:0 0 30px #ff9ee0,0 0 60px rgba(122,63,208,.6);animation:orb 3s ease-in-out infinite}
@keyframes orb{50%{transform:scale(1.07);box-shadow:0 0 40px #ff9ee0,0 0 80px rgba(122,63,208,.8)}}
/* modals */
.modal{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,3,20,.78);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.panel{width:86%;max-width:350px;border-radius:20px;padding:26px 20px 20px;text-align:center;background:linear-gradient(#352b6b,#221a48);box-shadow:0 0 0 2px var(--gold),0 0 0 6px #5a3a0a,0 0 0 8px var(--gold2),0 20px 40px rgba(0,0,0,.7);position:relative;animation:pin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pin{from{transform:scale(.7);opacity:0}}
.panel h2{margin:-46px auto 12px;display:inline-block;padding:8px 30px;font-size:24px;font-weight:900;letter-spacing:4px;background:linear-gradient(#e0483f,#a61f1a);border-radius:8px;box-shadow:0 3px 0 #5a0f0b,0 0 0 2px var(--gold);color:#ffe9a8;text-shadow:0 2px 0 #5a0f0b}
.panel p{margin:8px 0;line-height:1.6;font-size:15px}
.panel .col{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.panel .col .btn{min-width:180px}
.panel .gain{font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #6b3a0a;margin:6px 0}
.panel .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 4px;border-bottom:1px dashed rgba(255,255,255,.15)}
.panel .row b{color:var(--gold)}
.togrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#banner{position:absolute;top:84px;left:50%;transform:translate(-50%,-300%);opacity:0;z-index:25;padding:10px 20px;border-radius:99px;background:linear-gradient(#ff9ee0,#a64fc9);color:#fff;font-weight:900;font-size:16px;white-space:nowrap;box-shadow:0 0 0 2px #fff,0 8px 20px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .3s;pointer-events:none;text-shadow:0 2px 0 rgba(90,20,100,.7)}
#banner.on{transform:translate(-50%,0);opacity:1}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,10px);z-index:40;background:rgba(0,0,0,.8);padding:9px 18px;border-radius:99px;font-weight:800;font-size:14px;pointer-events:none;opacity:0;transition:.25s;white-space:nowrap;box-shadow:0 0 0 1.5px var(--gold)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div id="app">
 <section id="title" class="scr on">
  <canvas id="tcv"></canvas>
  <div class="tlogo"><div class="t1 serif">挂 机 修 仙 · 开 宗 立 派</div><h1 class="serif">仙门<br>大掌柜</h1><div class="t2">一人一石，亦可问鼎九天</div></div>
  <div class="tbtn"><div class="tinfo" id="tinfo"></div><button class="btn big serif" id="btnStart">踏入仙门</button></div>
  <div class="tfoot">点击聚灵 · 长老代劳 · 离线也能修炼 · 飞升转世</div>
 </section>
 <section id="main" class="scr">
  <header id="top">
   <div class="trow"><button class="ibtn" id="btnPause" aria-label="暂停"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
    <div class="sect"><b class="serif" id="sectName">凌云宗</b><small id="realm">炼气期</small></div>
    <button class="ibtn" id="btnSnd" aria-label="音效"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg></button></div>
   <div class="coinrow"><svg viewBox="0 0 32 32"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ffff"/><stop offset="1" stop-color="#2fd0c4"/></linearGradient></defs><path d="M16 2l11 9-11 19L5 11z" fill="url(#gg)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 11h22M11 11l5 19M21 11l-5 19M11 11l5-9 5 9" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1"/></svg><span id="coins">0</span></div>
   <div class="subrow"><span>每秒 <b id="ips">0</b></span><span class="k">仙缘 <b id="karma">0</b></span><span>加成 <b id="mult">+0%</b></span></div>
  </header>
  <div id="sceneWrap"><canvas id="scv"></canvas><div id="buff"></div><div id="combo"><span id="comboT"></span><i id="comboBar"></i></div><div id="tapval"></div></div>
  <div id="tut"><span class="f">☝</span><span id="tutT"></span></div>
  <div id="panes">
   <div class="pane on" id="p0"><div class="buybar" id="buybar"><span>购买</span><button data-m="1" class="on">×1</button><button data-m="10">×10</button><button data-m="100">×100</button><button data-m="0">最大</button></div><div id="bizList"></div></div>
   <div class="pane" id="p1"><div class="h-sec"><span>雇佣长老，自动经营产业（离线也生效）</span></div><div id="mgrList"></div></div>
   <div class="pane" id="p2"><div class="h-sec"><span>秘法永久提升收益</span><span id="upCount"></span></div><div id="upList"></div></div>
   <div class="pane" id="p3"><div class="h-sec"><span>成就奖励：每个 +2% 全局收益</span><span id="achCount"></span></div><div id="achList"></div></div>
   <div class="pane" id="p4"><div class="asc" id="ascPane"></div></div>
  </div>
  <nav class="nav" id="nav">
   <button class="on" data-t="0"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V10l7-6 7 6v10M9 20v-6h6v6"/></svg>产业<i class="dot"></i></button>
   <button data-t="1"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7"/></svg>长老<i class="dot"></i></button>
   <button data-t="2"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 9l-5 4.4L17.5 21 12 17.3 6.5 21 8 13.4 3 9l6.6-.4z"/></svg>秘法<i class="dot"></i></button>
   <button data-t="3"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 01-10 0V4zM5 5H3v2a3 3 0 003 3M19 5h2v2a3 3 0 01-3 3M12 14v4M8 21h8"/></svg>成就<i class="dot"></i></button>
   <button data-t="4"><svg viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 21h14M8 17c-2 1-3 2-3 4M16 17c2 1 3 2 3 4"/></svg>飞升<i class="dot"></i></button>
  </nav>
 </section>
 <div id="rot"><i>📱</i>请竖屏游玩</div><div id="banner"></div><div id="toast"></div>
 <div class="modal" id="mPause"><div class="panel"><h2>暂停</h2><p style="margin-top:0">修炼暂停中，时间静止。</p>
  <div class="col"><button class="btn jade" id="pResume">继续修炼</button>
  <div class="togrow"><button class="btn sm dark" id="pSound">音效：开</button><button class="btn sm dark" id="pMusic">音乐：开</button><button class="btn sm dark" id="pVib">震动：开</button></div>
  <button class="btn sm dark" id="pTitle">返回标题</button><button class="btn sm red" id="pReset">重置存档</button></div></div></div>
 <div class="modal" id="mOff"><div class="panel"><h2>闭关归来</h2><p id="offT"></p><div class="gain" id="offG"></div><p style="font-size:13px;color:#bdb2dd" id="offS"></p><div class="col"><button class="btn big serif" id="offOk" style="font-size:22px">收下灵石</button></div></div></div>
 <div class="modal" id="mAsc"><div class="panel"><h2>飞升</h2><div id="ascBody"></div><div class="col"><button class="btn red" id="ascYes">确认飞升</button><button class="btn sm dark" id="ascNo">再修炼一会</button></div></div></div>
 <div class="modal" id="mRes"><div class="panel"><h2>飞升成功</h2><div id="resBody"></div><div class="col"><button class="btn jade" id="resOk">开启下一世</button></div></div></div>
 <canvas id="fxc"></canvas>
</div>
<script>

function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<0)return '-'+fmt(-n);
  if(n<10)return n<.05?'0':(Math.round(n*10)/10).toString();
  if(n<1e4)return String(Math.floor(n));
  let idx=Math.floor(Math.log10(n)/4),v=n/Math.pow(1e4,idx);
  if(v<1){idx--;v=n/Math.pow(1e4,idx)}
  const rnd=x=>x<10?Math.round(x*100)/100:x<100?Math.round(x*10)/10:Math.round(x);
  let r=rnd(v);if(r>=1e4){idx++;r=rnd(v/1e4)}
  if(idx>=UNITS.length)return n.toExponential(2).replace('e+','e');
  return r+UNITS[idx];
}

function buyBiz(i){

let tutDoneT=0;

function tutFix(){if(S.tut<5&&S.asc>0)S.tut=5;if(S.tut<5&&S.biz.some(b=>b.mgr))S.tut=5;if(S.tut<5)$('#tut').classList.add('on');else $('#tut').classList.remove('on')}

  const box=$('#tut'),T=$('#tutT');
  document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
  if(S.tut>=5){box.classList.remove('on');return}
  box.classList.add('on');
  if(S.tut===0){T.textContent='点击上方发光的灵石，聚集灵气！（'+Math.min(5,S.taps)+'/5）';if(S.taps>=5){S.tut=1;persist()}}

    if(S.biz[0].lv>=1){S.tut=2;return}
    if(S.coins>=4){T.textContent='灵石足够啦！点击【购买】开设「药田」';hl(cards[0]&&cards[0].buy,true)}else T.textContent='继续点击灵石，攒够 4 枚灵石…（'+fmt(S.coins)+'/4）';
  }else if(S.tut===2){
    T.textContent='点击「药田」的进度条开始产出灵石，升级可提高收益！（'+Math.min(4,S.manual)+'/4）';
    hl(cards[0]&&cards[0].bar,true);if(S.manual>=4){S.tut=3;persist()}
  }else if(S.tut===3){
    if(S.biz.some(b=>b.mgr)){S.tut=4;tutDoneT=performance.now();return}
    T.textContent='攒够 '+fmt(BIZ[0].mgr.c)+' 灵石，去【长老】页雇佣长老自动经营！';
    if(S.coins>=BIZ[0].mgr.c&&tab!==1)hl(document.querySelector('#nav button[data-t="1"]'),true);
    if(tab===1&&S.coins>=BIZ[0].mgr.c)hl(mgrEls[0]&&mgrEls[0].buy,true);
  }else if(S.tut===4){
    T.textContent='长老会自动经营，离线也有收益！继续扩张，攒够灵石可【飞升】获得仙缘加成。';
    if(performance.now()-tutDoneT>7000){S.tut=5;persist()}
  }

  $('#offT').innerHTML='你闭关了 <b style="color:var(--gold)">'+fmtTime(sec)+'</b>'+(sec>OFFLINE_CAP?'<br><span style="font-size:12px;color:#bdb2dd">（离线收益最多累积 8 小时）</span>':'')+'<br>长老们为你经营宗门，共获得';
  $('#offG').innerHTML=gemSVG().replace('width="16" height="16"','width="30" height="30"')+' '+fmt(earn);
  $('#offS').textContent='每秒收益 '+fmt(MULT.ips)+' × '+fmtTime(eff);

}

  stexts.forEach(f=>{const p=f.age/f.life,a=p>.6?1-(p-.6)/.4:1,sc=p<.12?.5+p/.12*.5:1;c.save();c.globalAlpha=a;c.translate(f.x,f.y);c.scale(sc,sc);c.textAlign='center';c.textBaseline='middle';c.font='900 '+f.size+'px "Noto Sans CJK SC","PingFang SC",sans-serif';c.lineJoin='round';c.lineWidth=4;c.strokeStyle='rgba(60,20,90,.9)';c.strokeText(f.text,0,0);c.fillStyle=f.col;c.fillText(f.text,0,0);c.restore()});
}
function spawnTap(x,y,val,crit,combo){
  for(let i=0;i<(crit?22:9);i++){const a=rand(0,6.283),s=rand(40,crit?260:150);sparts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,g:300,life:0,max:rand(.4,.9),col:['#9ffff2','#fff','#ffd36b','#ff9ee0'][i%4],size:rand(2.5,5),type:i%3,rot:rand(0,6),vr:rand(-8,8)})}
  ripples.push({x,y,R:crit?70:38,age:0,dur:.45,col:crit?'#ffd36b':'#9ffff2'});
  stexts.push({x:x+rand(-14,14),y:y-10,vy:-70,text:(crit?'暴击 ':'+')+fmt(val),col:crit?'#ffd36b':'#fff',size:crit?24:16,age:0,life:.85});
  if(sparts.length>300)sparts.splice(0,sparts.length-300);
}
/* ===== 点击 ===== */
let shakeScene=0;
function doTap(x,y){
  audioInit();const now=performance.now();
  if(now-lastTap<650)combo++;else combo=1;lastTap=now;comboT=1.1;
  S.maxCombo=Math.max(S.maxCombo,combo);
  let val=tapValue(combo);const crit=Math.random()<.07;if(crit)val*=7;
  S.coins+=val;S.run+=val;S.life+=val;S.taps++;orbPulse=1;
  spawnTap(x,y,val,crit,combo);
  if(crit){SFX.crit();vib([12,16,24]);shakeScene=7}else{SFX.tap(Math.floor(combo/3));vib(6)}
  if(combo>=5){$('#combo').classList.add('on');$('#comboT').textContent='连击 ×'+combo+(combo>=60?' MAX':'')}
  if(combo===50){banner('一气呵成！连击 50');vib([30,30,60])}
  $('#coins').classList.remove('bump');void $('#coins').offsetWidth;$('#coins').classList.add('bump');
}
/* ===== 机缘：随机出现的金色灵球（点击获得灵石雨或×7聚灵风暴，灵感来自 Cookie Clicker 金饼干 / Antimatter Dimensions 的随机事件）===== */
const LUCK={t:50,orb:null,buff:0,buffM:1};
function luckPos(o){return {x:o.x+Math.sin(o.age*1.3+o.ph)*38,y:o.y+Math.cos(o.age*1.9+o.ph)*14}}
function luckTick(dt){
  if(LUCK.buff>0){LUCK.buff-=dt;const b=$('#buff');if(LUCK.buff<=0){LUCK.buffM=1;b.classList.remove('on')}else b.textContent='聚灵风暴 ×'+LUCK.buffM+' · '+Math.ceil(LUCK.buff)+'秒'}
  if(LUCK.orb){LUCK.orb.age+=dt;if(LUCK.orb.age>LUCK.orb.life)LUCK.orb=null;return}
  LUCK.t-=dt;
  if(LUCK.t<=0&&screen==='main'&&!paused){const W=scv.clientWidth,H=scv.clientHeight;LUCK.t=rand(75,140);LUCK.orb={x:W*rand(.25,.75),y:H*rand(.3,.5),age:0,life:11,ph:rand(0,6)};SFX.lucky()}
}
function drawLuck(c){
  const o=LUCK.orb;if(!o)return;const p=luckPos(o),fa=Math.min(1,o.age/.5,(o.life-o.age)/1.2),pul=1+Math.sin(time*6)*.1;
  c.save();c.globalAlpha=fa;
  const g=c.createRadialGradient(p.x,p.y,4,p.x,p.y,48*pul);g.addColorStop(0,'rgba(255,240,150,.95)');g.addColorStop(.4,'rgba(255,200,60,.4)');g.addColorStop(1,'rgba(255,180,40,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,48*pul,0,7);c.fill();
  c.fillStyle='#ffd24a';c.strokeStyle='#a86a00';c.lineWidth=2.5;c.beginPath();c.arc(p.x,p.y,19*pul,0,7);c.fill();c.stroke();
  c.fillStyle='#fff3b0';c.beginPath();c.arc(p.x-6,p.y-6,6,0,7);c.fill();
  c.fillStyle='#a86a00';c.font='900 15px "Noto Sans CJK SC","PingFang SC",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('缘',p.x+1,p.y+2);
  c.restore();
}
function luckCollect(){
  const o=LUCK.orb,p=luckPos(o);LUCK.orb=null;SFX.lucky();vib([15,20,40]);
  fxBurstScene(p.x,p.y);
  if(Math.random()<.5||MULT.ips<=0){
    const val=Math.max(MULT.ips*600,tapValue(1)*80);S.coins+=val;S.run+=val;S.life+=val;
    stexts.push({x:p.x,y:p.y-20,vy:-50,text:'机缘 +'+fmt(val),col:'#ffe14d',size:26,age:0,life:1.6});banner('机缘天降！获得 '+fmt(val)+' 灵石');
  }else{
    LUCK.buff=30;LUCK.buffM=7;$('#buff').classList.add('on');stexts.push({x:p.x,y:p.y-20,vy:-50,text:'聚灵风暴 ×7',col:'#ffe14d',size:26,age:0,life:1.6});banner('聚灵风暴！产业收益 ×7，持续 30 秒');
  }
  S.luckCnt=(S.luckCnt||0)+1;
}
function fxBurstScene(x,y){for(let i=0;i<30;i++){const a=rand(0,6.283),s=rand(60,300);sparts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,g:300,life:0,max:rand(.5,1.1),col:['#ffe14d','#fff','#ffb52e','#fff3b0'][i%4],size:rand(3,6),type:i%3,rot:rand(0,6),vr:rand(-8,8)})}ripples.push({x,y,R:80,age:0,dur:.6,col:'#ffe14d'})}
function bindScene(){
  scv.addEventListener('pointerdown',e=>{e.preventDefault();const r=scv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(LUCK.orb){const p=luckPos(LUCK.orb);if(Math.hypot(x-p.x,y-p.y)<42){audioInit();luckCollect();return}}
    doTap(x,y)});
}
/* ===== 主循环 ===== */
let last=performance.now(),slowT=0,saveT=0;
function tick(dt){
  time+=dt;
  S.biz.forEach((b,i)=>{
    if(b.lv<=0)return;
    if(!(b.mgr||b.p>0))return;
    b.p+=dt;const T=BIZ[i].t;
    if(b.p>=T){
      const cyc=Math.floor(b.p/T),earn=cyc*bizRev(i)*LUCK.buffM;
      S.coins+=earn;S.run+=earn;S.life+=earn;
      if(b.mgr)b.p-=cyc*T;else b.p=0;
      SFX.cyc();
      const c=cards[i];if(c&&c.el.style.display!=='none'&&tab===0&&screen==='main'){
        const ic=elCenter(c.el.querySelector('.ico'));
        if(performance.now()-c.fxT>180){c.fxT=performance.now();fxText(ic.x+30,ic.y-10,'+'+fmt(earn),'#ffe9a0',16,.9);
          const tg=elCenter($('#coins'));fxs.parts.push({x:ic.x,y:ic.y,fly:1,tx:tg.x,ty:tg.y,life:0,max:.55,col:'#7ffff0',size:5,type:2,rot:0,vr:6,vx:0,vy:0,g:0,sx:ic.x,sy:ic.y,cx:ic.x+rand(-50,50),cy:ic.y-rand(30,80)})}
      }
    }
  });
  slowT+=dt;if(slowT>.16){slowT=0;uiSlow()}
  saveT+=dt;if(saveT>5){saveT=0;persist()}
  if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;$('#combo').classList.remove('on')}else $('#comboBar').style.width=Math.min(100,comboT/1.1*100)+'%'}
  orbPulse=Math.max(0,orbPulse-dt*4);
  luckTick(dt);
}
function frame(now){
  let dt=Math.min(.1,(now-last)/1000);last=now;
  if(screen==='main'&&!paused)tick(dt);
  else time+=dt;
  if(screen==='main'){
    dispCoins+=(S.coins-dispCoins)*Math.min(1,dt*10);if(Math.abs(S.coins-dispCoins)<.5)dispCoins=S.coins;
    $('#coins').textContent=fmt(dispCoins);
    updateBars();
    const w=scv.clientWidth,h=scv.clientHeight;sizeCanvas(scv,w,h);sctx.setTransform(DPR,0,0,DPR,0,0);
    if(shakeScene>.2){sctx.translate((Math.random()-.5)*shakeScene,(Math.random()-.5)*shakeScene);shakeScene*=.85}else shakeScene=0;
    SC=drawScene(sctx,w,h,time,'main');
    if(!paused){updateParts(sparts,dt);stexts.forEach(f=>{f.age+=dt;f.y+=f.vy*dt});for(let i=stexts.length-1;i>=0;i--)if(stexts[i].age>=stexts[i].life)stexts.splice(i,1);ripples.forEach(r=>r.age+=dt);for(let i=ripples.length-1;i>=0;i--)if(ripples[i].age>=ripples[i].dur)ripples.splice(i,1)}
    drawLuck(sctx);drawSceneFx(sctx,w,h);
  }else if(screen==='title'){
    const a=$('#title').getBoundingClientRect();sizeCanvas(tcv,a.width,a.height);tctx.setTransform(DPR,0,0,DPR,0,0);drawScene(tctx,a.width,a.height,time,'title');
  }
  drawFx(dt);
  requestAnimationFrame(frame);
}
function updateParts(arr,dt){for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.life+=dt;if(p.life>=p.max){arr.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
function drawFx(dt){
  const a=appRect();sizeCanvas(fxc,a.width,a.height);const c=fctx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,a.width,a.height);
  if(!paused||fxs.flash>0){
    for(let i=fxs.parts.length-1;i>=0;i--){const p=fxs.parts[i];p.life+=dt;if(p.life>=p.max){if(p.fly){$('#coins').classList.remove('bump');void $('#coins').offsetWidth;$('#coins').classList.add('bump')}fxs.parts.splice(i,1);continue}
      if(p.fly){const e=p.life/p.max,k=e*e*(3-2*e);p.x=(1-k)*(1-k)*p.sx+2*(1-k)*k*p.cx+k*k*p.tx;p.y=(1-k)*(1-k)*p.sy+2*(1-k)*k*p.cy+k*k*p.ty}
      else{p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}p.rot+=p.vr*dt}
    for(let i=fxs.texts.length-1;i>=0;i--){const f=fxs.texts[i];f.age+=dt;f.y-=40*dt;if(f.age>=f.life)fxs.texts.splice(i,1)}
    fxs.flash=Math.max(0,fxs.flash-dt*1.6);
  }
  fxs.parts.forEach(p=>{const al=p.fly?1:1-p.life/p.max;c.globalAlpha=Math.max(0,al);c.fillStyle=p.col;
    if(p.type===0){c.beginPath();c.arc(p.x,p.y,p.size*al+.5,0,7);c.fill()}
    else if(p.type===1)star8(c,p.x,p.y,p.size*1.6*al+1,p.rot);
    else{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();c.moveTo(0,-p.size);c.lineTo(p.size*.7,0);c.lineTo(0,p.size);c.lineTo(-p.size*.7,0);c.closePath();c.fill();c.restore()}});c.globalAlpha=1;
  fxs.texts.forEach(f=>{const p=f.age/f.life;c.globalAlpha=p>.6?1-(p-.6)/.4:1;c.textAlign='center';c.textBaseline='middle';c.font='900 '+f.size+'px "Noto Sans CJK SC","PingFang SC",sans-serif';c.lineJoin='round';c.lineWidth=4;c.strokeStyle='rgba(40,15,70,.9)';c.strokeText(f.text,f.x,f.y);c.fillStyle=f.col;c.fillText(f.text,f.x,f.y)});c.globalAlpha=1;
  if(fxs.flash>0){c.fillStyle='rgba(255,255,255,'+Math.min(1,fxs.flash)+')';c.fillRect(0,0,a.width,a.height)}
}
/* ===== 屏幕/事件 ===== */
function show(name){screen=name;$('#title').classList.toggle('on',name==='title');$('#main').classList.toggle('on',name==='main')}
function setLabels(){
  $('#pSound').textContent='音效：'+(S.sound?'开':'关');$('#pMusic').textContent='音乐：'+(S.music?'开':'关');$('#pVib').textContent='震动：'+(S.vib?'开':'关');$('#btnSnd').style.opacity=S.sound?1:.4;
}
function titleInfo(){
  $('#btnStart').textContent=S.life>0?'继续修炼':'踏入仙门';
  $('#tinfo').textContent=S.life>0?('累计灵石 '+fmt(S.life)+' · 仙缘 '+S.karma+' · '+REALMS[realmIdx()]):'点击聚灵 · 经营产业 · 飞升成仙';
}
function startGame(){
  audioInit();SFX.click();show('main');tutFix();buildAll();setTab(tab);
  const el=(Date.now()-S.last)/1000;paused=false;applyOffline(el);
  last=performance.now();
}
function bind(){
  $('#btnStart').addEventListener('click',startGame);
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audioInit();SFX.tab();setTab(+b.dataset.t)});
  $('#buybar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audioInit();SFX.click();buyMode=+b.dataset.m;document.querySelectorAll('#buybar button').forEach(x=>x.classList.toggle('on',x===b));uiSlow(true)});
  $('#btnPause').addEventListener('click',()=>{audioInit();SFX.click();paused=true;MUS.duck(.35);persist();$('#mPause').classList.add('on')});
  $('#pResume').addEventListener('click',()=>{SFX.click();$('#mPause').classList.remove('on');paused=false;MUS.duck(1);last=performance.now()});
  const tg=k=>()=>{audioInit();S[k]=S[k]?0:1;persist();setLabels();SFX.click();if(k==='vib')vib(30);MUS.ensure()};
  $('#pSound').addEventListener('click',tg('sound'));$('#btnSnd').addEventListener('click',tg('sound'));$('#pMusic').addEventListener('click',tg('music'));$('#pVib').addEventListener('click',tg('vib'));
  $('#pTitle').addEventListener('click',()=>{SFX.click();$('#mPause').classList.remove('on');paused=false;persist();show('title');titleInfo()});
  let rc=0;$('#pReset').addEventListener('click',()=>{if(rc){try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=defSave();recalc();dispCoins=0;rc=0;$('#pReset').textContent='重置存档';$('#mPause').classList.remove('on');paused=false;buildAll();tutFix();show('title');titleInfo();toast('存档已重置')}else{rc=1;$('#pReset').textContent='再点一次确认重置';setTimeout(()=>{rc=0;$('#pReset').textContent='重置存档'},2500)}});
  $('#offOk').addEventListener('click',()=>{SFX.claim();$('#mOff').classList.remove('on');paused=false;last=performance.now();const a=appRect();fxBurst(a.width/2,120,26,['#7ffff0','#fff','#ffd36b'],260,2);persist()});
  $('#ascYes').addEventListener('click',()=>{doAscend()});
  $('#ascNo').addEventListener('click',()=>{SFX.click();$('#mAsc').classList.remove('on');paused=false;last=performance.now()});
  $('#resOk').addEventListener('click',()=>{SFX.click();$('#mRes').classList.remove('on');paused=false;last=performance.now();setTab(0)});
  bindScene();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){persist()}
    else if(screen==='main'&&!paused){const el=(Date.now()-S.last)/1000;applyOffline(el)}
  });
  window.addEventListener('pagehide',persist);
  document.addEventListener('contextmenu',e=>e.preventDefault());
}
function boot(){
  MUS.init({bpm:76,root:62,scale:[0,2,4,7,9],spb:8,seed:5,rest:.45,vol:.5,prog:[[0,4,7],[-3,0,4],[-5,-1,2],[-7,-3,0]],bass:[1,0,0,0,0,0,1,0],bassWave:'sine',bassLen:3,pad:true,arp:[1,0,1,1,0,1,0,0],arpWave:'triangle',melody:true,leadWave:'sine',leadBell:true});
  recalc();dispCoins=S.coins;bind();setLabels();titleInfo();buildAll();
  requestAnimationFrame(frame);
}
window.__idle={LUCK,luckCollect,tapValue,S:()=>S,recalc,cheat:n=>{S.coins+=n;S.run+=n;S.life+=n},tick,fmt,startGame,setTab,buyBiz,hireMgr,pendingKarma,doAscend,openAscend,applyOffline,persist,uiSlow,UPS,ACH,BIZ,doTap,runManual,claimAch,buyUpg};
boot();
</script>
