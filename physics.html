<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#5ec7ff">
<title>砸个稀巴烂</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#2b3a67;color:#fff;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
#app{position:fixed;inset:0;overflow:hidden;background:#5ec7ff}
#rot{position:fixed;inset:0;z-index:99;background:#2b3a67;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:22px;font-weight:900;text-align:center}#rot i{font-size:56px;font-style:normal;animation:bob 1.6s infinite}
@media (orientation:landscape) and (max-height:520px){#rot{display:flex}}
.scr{position:absolute;inset:0;display:none;overflow:hidden}.scr.on{display:block}
.btn{border:0;font:inherit;font-weight:900;cursor:pointer;color:#5a2a00;background:linear-gradient(#ffe980,#ffb320);border-radius:16px;padding:13px 32px;font-size:22px;box-shadow:0 5px 0 #b86a00,0 10px 18px rgba(40,20,0,.4),inset 0 2px 0 rgba(255,255,255,.7);transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(255,255,255,.55);position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b86a00,0 4px 8px rgba(40,20,0,.35)}
.btn.green{background:linear-gradient(#c6ff8a,#4cc43a);color:#0b4208;box-shadow:0 5px 0 #25881a,0 10px 18px rgba(0,40,0,.35),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.blue{background:linear-gradient(#a6e6ff,#3aa7ff);color:#04386b;box-shadow:0 5px 0 #1c6cc0,0 10px 18px rgba(0,20,60,.35),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.red{background:linear-gradient(#ff9e8f,#e8412f);color:#fff;text-shadow:0 2px 0 rgba(120,20,10,.6);box-shadow:0 5px 0 #8f1c10,0 10px 18px rgba(60,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.sm{font-size:16px;padding:9px 18px;border-radius:12px}
.btn.big{font-size:32px;padding:18px 58px;border-radius:22px}
.btn[disabled]{filter:grayscale(.8);opacity:.6;pointer-events:none}

.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a14a08}
.ibtn svg{width:22px;height:22px;fill:#fff}
#title canvas,#game canvas{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;top:9%;left:0;right:0;text-align:center}
.logo .sub{font-size:16px;font-weight:800;letter-spacing:6px;color:#fff;text-shadow:0 2px 0 #1c6cc0,0 0 10px rgba(0,60,120,.5)}
.logo h1{margin:6px 0 0;font-size:76px;line-height:1.02;font-weight:900;color:#ffe14d;letter-spacing:2px;-webkit-text-stroke:9px #7a2a00;paint-order:stroke fill;text-shadow:0 8px 0 #4a1a00,0 14px 24px rgba(0,0,0,.4);animation:bob 2.6s ease-in-out infinite}
.logo h1 span{display:block}.logo h1 span:nth-child(2){color:#ff6a4d;font-size:84px}

.tbtns{position:absolute;bottom:calc(8% + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:18px}
.trow{display:flex;gap:12px}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.tfoot{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:12px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.5)}

.lvbar{position:absolute;top:0;left:0;right:0;height:64px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#ff9a3a,#e8741a);box-shadow:0 4px 0 #a14a08;z-index:3;font-weight:900;font-size:21px;text-shadow:0 2px 0 rgba(120,50,0,.6)}
.lvbar .st{background:rgba(0,0,0,.25);padding:6px 14px;border-radius:99px;color:#ffe55c;font-size:17px}
#lvScroll{position:absolute;inset:0;overflow-y:auto;padding:84px 14px 24px;touch-action:pan-y;scrollbar-width:none}
#lvScroll::-webkit-scrollbar{display:none}
.world{margin:6px 2px 10px;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(30,80,140,.8)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:10px}
.lv{aspect-ratio:1;border:0;border-radius:18px;font:inherit;font-weight:900;font-size:26px;color:#5a2a00;background:linear-gradient(#ffe980,#ffb320);box-shadow:0 5px 0 #b86a00,0 8px 12px rgba(0,40,80,.25),inset 0 2px 0 rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 #b86a00}
.lv.cur{animation:pulse 1.2s infinite;background:linear-gradient(#ffb3a6,#ff5a3f);color:#fff;text-shadow:0 2px 0 #a8200f;box-shadow:0 5px 0 #a8200f,0 0 0 4px #fff}
.lv.lock{background:linear-gradient(#cfd5e6,#939bb5);color:#6b7390;box-shadow:0 5px 0 #6b7390;cursor:default;text-shadow:none}
.lv .ss{display:flex;gap:1px;height:16px}.lv .ss svg{width:16px;height:16px}

#hud{position:absolute;top:0;left:0;right:0;z-index:4;padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
#hud button{pointer-events:auto}
.hmid{text-align:center;text-shadow:0 2px 0 rgba(90,40,0,.8),0 0 8px rgba(0,0,0,.35)}
.hmid b{font-size:21px;display:block;line-height:1.1}
.hmid .sc{font-size:26px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.hrow{display:flex;gap:8px}
#tgt{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;background:rgba(40,20,70,.55);border-radius:99px;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
#tgt img{width:28px;height:28px}
#queue{position:absolute;left:8px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:6px;align-items:flex-end;pointer-events:none}

#queue .q.cur{transform:scale(1.25);box-shadow:0 0 0 3px #ffe14d;background:rgba(255,225,77,.3)}
#queue .q img{width:32px;height:32px}
#rbtn{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4}
#tip{position:absolute;top:26%;left:50%;transform:translate(-50%,0);z-index:5;max-width:84%;text-align:center;background:rgba(40,20,70,.82);border-radius:18px;padding:12px 18px;font-size:16px;font-weight:800;line-height:1.5;pointer-events:none;box-shadow:0 0 0 2px #ffe14d,0 8px 20px rgba(0,0,0,.35);opacity:0;transition:opacity .3s;display:none}

.modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(20,10,50,.62);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.panel{width:84%;max-width:340px;border-radius:28px;padding:30px 20px 22px;text-align:center;background:linear-gradient(#ffd98a,#ffb54a);color:#5a2a00;box-shadow:0 0 0 5px #fff,0 0 0 9px #c4701a,0 18px 40px rgba(20,0,0,.55);position:relative;animation:pin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.panel h2{margin:-58px auto 12px;display:inline-block;padding:10px 32px;font-size:28px;font-weight:900;background:linear-gradient(#ff8a70,#e8412f);color:#fff;border-radius:99px;box-shadow:0 5px 0 #8f1c10,0 0 0 3px #fff;text-shadow:0 2px 0 #8f1c10;letter-spacing:3px}
.panel p{margin:8px 0;font-size:16px;line-height:1.5;font-weight:700}
.panel .col{display:flex;flex-direction:column;gap:13px;align-items:center;margin-top:16px}
.panel .col .btn{min-width:176px}
.bigstars{display:flex;justify-content:center;gap:2px;margin:2px 0 6px;height:92px}
.bigstars svg{width:84px;height:84px;transform:scale(0);filter:drop-shadow(0 4px 0 rgba(120,60,0,.4))}
.bigstars svg:nth-child(2){margin-top:-14px}
.bigstars svg.on{animation:starin .55s cubic-bezier(.2,1.8,.4,1) forwards}

.score-big{font-size:42px;font-weight:900;color:#fff;-webkit-text-stroke:6px #a14a08;paint-order:stroke fill;text-shadow:0 4px 0 #a14a08}
.togrow{display:flex;gap:8px;justify-content:center}.togrow .btn{min-width:0!important;padding:8px 9px;font-size:14px;white-space:nowrap}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,0);z-index:30;background:rgba(40,10,90,.85);padding:10px 20px;border-radius:99px;font-weight:800;font-size:17px;pointer-events:none;opacity:0;transition:.25s;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>

<div id="app">
 <section id="title" class="scr on">
  <canvas id="tcv"></canvas>
  <div class="logo"><div class="sub">弹 弓 · 爆 破 · 拆 迁</div><h1><span>砸个</span><span>稀巴烂</span></h1></div>

   <div class="trow"><button class="btn sm blue" id="tSound">音效：开</button><button class="btn sm blue" id="tMusic">音乐：开</button><button class="btn sm blue" id="tVib">震动：开</button></div><button class="btn sm red" id="tReset" style="font-size:13px;padding:6px 14px;opacity:.85">清除存档</button></div>
  <div class="tfoot">拉弓 · 瞄准 · 发射 · 32 关拆迁挑战</div>
 </section>
 <section id="levels" class="scr">

  <div id="lvScroll"></div>
 </section>
 <section id="game" class="scr">
  <canvas id="gcv"></canvas>
  <div id="hud"><button class="ibtn" id="btnPause" aria-label="暂停"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
   <div class="hmid"><b id="hTitle">第1关</b><div class="sc" id="hScore">0</div></div>
   <div class="hrow"><button class="ibtn" id="btnSnd">♪</button></div></div>
  <div id="tgt"><img id="tgtImg" alt=""><span id="tgtN">×3</span></div>
  <div id="queue"></div>
  <button class="ibtn" id="rbtn" aria-label="重来" style="width:auto;padding:0 14px;font-size:16px">重来</button>
  <div id="tip"></div><div id="abil">点击屏幕触发技能！</div>
 </section>
 <div class="modal" id="pause"><div class="panel"><h2>暂停</h2>
   <div class="col"><button class="btn green" id="pResume">继续游戏</button><button class="btn blue" id="pRestart">重新开始</button><button class="btn red" id="pQuit">返回关卡</button>
   <div class="togrow"><button class="btn sm blue" id="pSound">音效：开</button><button class="btn sm blue" id="pMusic">音乐：开</button><button class="btn sm blue" id="pVib">震动：开</button></div></div></div></div>
 <div class="modal" id="result"><div class="panel"><h2 id="resTitle">过关！</h2><div class="bigstars" id="resStars"></div><div id="resBody"></div><div class="col" id="resBtns"></div></div></div>
 <div id="toast"></div>
 <div id="rot"><i>📱</i>请竖屏游玩</div>
</div>

class World{
  constructor(){this.bodies=[];this.arbs=new Map();this.gx=0;this.gy=980;this.iter=10;this.events=[];this.touch=[]}
  add(b){this.bodies.push(b);return b}
  remove(b){b.dead=true;const i=this.bodies.indexOf(b);if(i>=0)this.bodies.splice(i,1);for(const [k,a] of this.arbs)if(a.a===b||a.b===b)this.arbs.delete(k)}
  step(dt){
    const B=this.bodies,n=B.length,inv=1/dt;this.events.length=0;this.stepNo=(this.stepNo||0)+1;
    // 宽相 + 窄相
    const ext=B.map(bodyExtents);

    for(let i=0;i<n;i++){
      const a=B[i];

        const b=B[j];if(a.static&&b.static)continue;

        let A=a,Bb=b;if(A.id>Bb.id){A=b;Bb=a}

    for(const b of B){if(b.static)continue;b.vx+=this.gx*dt;b.vy+=this.gy*dt}

        c.r1x=r1x;c.r1y=r1y;c.r2x=r2x;c.r2y=r2y;c.tx=tx;c.ty=ty;

        const vn=dvx*c.nx+dvy*c.ny;

      for(const arb of this.arbs.values()){

    }
  }

let timeS=0,shakeA=0;
function layout(){
  const r=$('#game').getBoundingClientRect();if(!r.width)return;
  fitView(r,h=>h-150);
  gcv.width=Math.round(VW*DPR);gcv.height=Math.round(VH*DPR);
}

function cntSlimes(){let n=0;for(const b of world.bodies)if(b.ud.kind==='slime')n++;return n}
async function startLevel(n){
  closeModals();show('game');layout();
  _seed=n*7919;LV=LEVELS[n-1];world=new World();world.gy=980;parts.length=0;floats.length=0;rings.length=0;
  const gnd=mkBody({type:'box',x:WW/2,y:GY+80,hw:900,hh:80,static:true,fric:.9,rest:.02,ud:{kind:'ground'}});world.add(gnd);
  const wall_=mkBody({type:'box',x:Math.max(WW,XR)+16,y:GY-700,hw:16,hh:720,static:true,fric:.3,rest:.3,ud:{kind:'wall'}});world.add(wall_);
  LV.b();
  G={n,state:'settle',queue:LV.shots.slice(),cur:null,ball:null,balls:[],score:0,shown:0,total:LV.shots.length,flyT:0,quietT:0,comboN:0,comboT:0,pull:null,slow:1,winT:0,winDone:false,t:0,presettle:1.0,destroyed:0,used:0,theme:Math.floor((n-1)/8),ended:false,hand:n===1&&!save.tips.t1,maxCombo:0,bombT:0};
  save.plays++;persist();
  $('#hTitle').textContent='第'+n+'关';$('#hScore').textContent='0';
  buildQueue();updateTgt();
  const tip=TIPS[n];if(tip&&!save.tips['t'+n]){showTip(tip);save.tips['t'+n]=1;persist()}else hideTip();
  $('#abil').classList.remove('on');setLabels();
}
function buildQueue(){
  const q=$('#queue');q.innerHTML='';
  const all=[];if(G.cur)all.push(G.cur);G.queue.forEach(t=>all.push(t));
  all.forEach((t,i)=>{const d=document.createElement('div');d.className='q'+(i===0&&G.cur?' cur':'');d.innerHTML='<img src="'+ballIconC(t)+'">';q.appendChild(d)});
}
function updateTgt(){const n=cntSlimes();$('#tgtN').textContent='×'+n;G.slimes=n}
function nextBall(){
  if(!G.queue.length){G.cur=null;return}
  G.cur=G.queue.shift();G.ballPop=0;G.state='aim';G.ready=0;buildQueue();
}
let tipT=0;
function showTip(s){const t=$('#tip');t.textContent=s;t.style.display='block';requestAnimationFrame(()=>t.classList.add('on'));clearTimeout(tipT);tipT=setTimeout(hideTip,5200)}
function hideTip(){const t=$('#tip');t.classList.remove('on');setTimeout(()=>{if(!t.classList.contains('on'))t.style.display='none'},300)}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1700)}

function spawnDebris(x,y,mat,n,vx0,vy0,spd){

}
function spawnDust(x,y,n,col,big){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(10,big?120:60);parts.push({k:'dust',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,g:-20,life:0,max:rand(.5,1.0),col:col||'rgba(235,235,235,',r:rand(5,big?20:12)})}}
function spawnStars(x,y,n,cols){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(80,300);parts.push({k:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,g:500,life:0,max:rand(.5,1.0),col:cols[i%cols.length],r:rand(4,9),rot:rand(0,6),vr:rand(-9,9)})}}
function ringFx(x,y,R,col,dur){rings.push({x,y,R,col,age:0,dur:dur||.5})}
function floatT(x,y,text,col,size){floats.push({x,y,text,col:col||'#fff',size:size||20,age:0,life:1.1})}
function shake(a){shakeA=Math.max(shakeA,a)}
function addScore(p,x,y,col){G.score+=p;if(x!==undefined)floatT(x,y,'+'+p,col||'#fff',p>=500?26:p>=100?20:16)}
function comboHit(){
  G.comboN++;G.comboT=1.0;
  if(G.comboN>=4&&(G.comboN%2===0)){G.maxCombo=Math.max(G.maxCombo,G.comboN);for(let i=floats.length-1;i>=0;i--)if(floats[i].cmb)floats.splice(i,1);floatT((XL+XR)/2,GY-330,'连锁崩塌 ×'+G.comboN+'！','#ffe14d',32);floats[floats.length-1].cmb=1;floats[floats.length-1].life=1.5;SFX.combo(G.comboN);vib([10,15,10]);shake(4)}
}

/* ---- 伤害/销毁 ---- */
function dmgBody(b,dv,ev){
  const u=b.ud;if(!u||b.static||u.kind==='ball'||u.kind==='ground'||u.kind==='wall')return;
  let vmin,vb;
  if(u.kind==='slime'){vmin=SLV[0];vb=SLV[1]}else{const m=MAT[u.mat];vmin=m.vmin;vb=m.vb}
  if(dv<vmin)return;
  const d=100*(dv-vmin)/(vb-vmin);u.hp-=d;u.hurt=.4;
  if(u.hp<=0)destroy(b,ev);else if(u.kind==='slime'){SFX.hit('slime',ev.j)}
}
function destroy(b,ev){
  if(b.dead)return;const u=b.ud;
  if(u.kind==='slime'){
    addScore(1000,b.x,b.y-20,'#ffe14d');spawnStars(b.x,b.y,16,['#6be36a','#d9ffb8','#ffe14d','#fff']);spawnDust(b.x,b.y,8,'rgba(120,230,120,',true);ringFx(b.x,b.y,50,'#d9ffb8',.45);
    SFX.pop();vib([20,20,40]);shake(5);world.remove(b);updateTgt();comboHit();
    if(G.slimes===0&&G.state!=='win'&&G.state!=='lose')beginWin();
  }else{
    const m=MAT[u.mat];addScore(m.score,b.x,b.y-10,u.mat==='tnt'?'#ff9a5a':'#fff');G.destroyed++;
    spawnDebris(b.x,b.y,u.mat,u.mat==='glass'?16:10,b.vx,b.vy,u.mat==='glass'?260:200);spawnDust(b.x,b.y,u.mat==='stone'?7:4,u.mat==='stone'?'rgba(200,205,215,':'rgba(240,225,200,');
    SFX.crack(u.mat);world.remove(b);comboHit();vib(12);shake(u.mat==='stone'?4:2.5);
    if(u.mat==='tnt')explode(b.x,b.y,100,560,true);
  }
}
function explode(x,y,R,dv,big){
  ringFx(x,y,R,'#ffd24a',.5);ringFx(x,y,R*.6,'#fff',.35);spawnDust(x,y,18,'rgba(90,80,80,',true);spawnStars(x,y,26,['#ffd24a','#ff7a3a','#fff']);
  SFX.boom();vib([40,25,80]);shake(big?14:11);
  for(const b of world.bodies.slice()){
    if(b.static||b.dead)continue;const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy);if(d>R+(b.r||Math.max(b.hw,b.hh)))continue;
    const f=1-Math.min(1,d/(R+30));const nx=dx/(d||1),ny=dy/(d||1)-.15;
    b.vx+=nx*dv*f*(b.type==='circle'?1.15:1)*Math.min(1,260/Math.sqrt(b.mass));b.vy+=ny*dv*f*Math.min(1,260/Math.sqrt(b.mass));b.w+=(prand()*12-6)*f;
    if(b.ud.kind!=='ball')dmgBody(b,dv*f*.95+20,{j:dv*b.mass});
  }
}
function beginWin(){G.state='win';G.winT=0;G.slow=.3;bigBanner('全部消灭！')}
let banners=[];
function bigBanner(t){floats.push({x:(XL+XR)/2,y:GY-420,text:t,col:'#ffe14d',size:44,age:0,life:1.7,big:1})}

/* ---- 发射 / 技能 ---- */
function launch(px,py){
  const dx=SX-px,dy=SY-py,len=Math.hypot(dx,dy);const d=BALL[G.cur];
  const b=mkBody({type:'circle',x:px,y:py,r:d.r,density:d.dens,fric:.45,rest:d.rest,ud:{kind:'ball',type:G.cur,hp:999,hurt:0,born:G.t,trail:[],abil:0,hit:0}});
  b.vx=dx*13.5;b.vy=dy*13.5;world.add(b);G.balls.push(b);G.lead=b;G.state='fly';G.flyT=0;G.quietT=0;G.used++;G.launched=G.cur;G.cur=null;G.bombT=0;
  SFX.launch();vib(18);buildQueue();
  if(G.n===1&&G.hand){G.hand=false;save.tips.t1=1;persist();hideTip()}
  const t=ABIL[b.ud.type];if(t){$('#abil').textContent=t;$('#abil').classList.add('on')}
}
const ABIL={split:'点击屏幕：分裂！',dash:'点击屏幕：冲刺！',bomb:'点击屏幕：引爆！'};
function useAbility(){
  const b=G.balls.find(q=>!q.dead&&!q.ud.abil&&['split','dash','bomb'].includes(q.ud.type));if(!b)return;
  b.ud.abil=1;$('#abil').classList.remove('on');const t=b.ud.type;
  if(t==='split'){
    SFX.split();vib(20);ringFx(b.x,b.y,34,'#a9dcff',.35);
    const sp=Math.hypot(b.vx,b.vy),ang=Math.atan2(b.vy,b.vx);
    world.remove(b);const i=G.balls.indexOf(b);if(i>=0)G.balls.splice(i,1);
    [-.2,0,.2].forEach(da=>{const d=BALL.split,nb=mkBody({type:'circle',x:b.x+Math.cos(ang+da*3)*4,y:b.y+Math.sin(ang+da*3)*4,r:8.5,density:d.dens*1.1,fric:.45,rest:.2,ud:{kind:'ball',type:'split',hp:999,hurt:0,born:G.t,trail:[],abil:1,hit:0,mini:1}});nb.vx=Math.cos(ang+da)*sp*1.02;nb.vy=Math.sin(ang+da)*sp*1.02;world.add(nb);G.balls.push(nb)});
    G.lead=G.balls[G.balls.length-2];
  }else if(t==='dash'){
    SFX.dash();vib([10,10,20]);const sp=Math.hypot(b.vx,b.vy),k=Math.max(1,(sp>0?Math.min(1.7,1100/sp):1));b.vx*=1.45*k/1.0;b.vy*=1.45*k/1.0;
    spawnStars(b.x,b.y,10,['#fff0a0','#fff','#ffb21e']);ringFx(b.x,b.y,30,'#ffe14d',.3);shake(3);
  }else if(t==='bomb'){bombBlast(b)}
}
function bombBlast(b){explode(b.x,b.y,88,520,false);world.remove(b);const i=G.balls.indexOf(b);if(i>=0)G.balls.splice(i,1)}

/* ---- 主逻辑步进 ---- */
function logicStep(dt){
  G.t+=dt;
  if(G.presettle>0){G.presettle-=dt;world.step(dt);world.events.length=0;if(G.presettle<=0){updateTgt();nextBall()}return}
  world.step(dt);
  for(const ev of world.events){
    const ba=ev.a.ud.kind==='ball'?ev.a:ev.b.ud.kind==='ball'?ev.b:null;
    for(const b of [ev.a,ev.b]){if(b.static)continue;dmgBody(b,ev.j*b.invM,ev)}
    if(ev.vn>180){const o=ev.a.static?ev.b:ev.a,oo=o.ud.kind==='ball'?(o===ev.a?ev.b:ev.a):o;const mat=oo.ud.kind==='slime'?'slime':(oo.ud.mat||'stone');SFX.hit(mat,ev.j);
      if(ev.vn>260)spawnDust(ev.x,ev.y,2,'rgba(240,240,240,');if(ev.vn>450)shake(Math.min(7,ev.vn/150))}
    if(ba&&ba.ud.type==='bomb'&&!ba.ud.abil&&ev.vn>130&&!ba.ud.hit){ba.ud.hit=G.t}
  }
  // 炸弹自动引爆
  for(const b of G.balls.slice()){if(b.ud.type==='bomb'&&!b.ud.abil&&b.ud.hit&&G.t-b.ud.hit>.32){b.ud.abil=1;$('#abil').classList.remove('on');bombBlast(b)}}
  for(const b of world.bodies.slice()){
    if(b.ud.hurt>0)b.ud.hurt-=dt;
    if(b.ud.kind==='ball'){
      b.ud.trail.push(b.x,b.y);if(b.ud.trail.length>40)b.ud.trail.splice(0,2);
      if(b.x>XR+160||b.x<XL-160||b.y>Hh+150){world.remove(b);const i=G.balls.indexOf(b);if(i>=0)G.balls.splice(i,1)}
    }
    if((b.ud.kind==='block'||b.ud.kind==='slime')&&(b.y>Hh+200||b.x<XL-200||b.x>XR+200)){if(b.ud.kind==='slime'){destroy(b,{j:1})}else world.remove(b)}
  }
  for(const b of G.balls){if(b.y>GY-b.r-3){b.vx*=.9955;b.w*=.985}}
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.comboN=0}
  if(G.state==='fly'){
    G.flyT+=dt;
    let moving=false;for(const b of world.bodies){if(b.static)continue;const v2=b.vx*b.vx+b.vy*b.vy;if(b.ud.kind==='ball'?v2>900:(v2>400||Math.abs(b.w)>.6)){moving=true;break}}
    if(!moving)G.quietT+=dt;else G.quietT=0;
    if(G.balls.length===0&&G.flyT>.4)G.quietT+=dt;
    if((G.flyT>1.3&&G.quietT>.7)||G.flyT>9)endShot();
  }
  if(G.state==='win'){
    G.winT+=dt/Math.max(.05,G.slow);G.slow=Math.min(1,G.slow+dt*.4);
    if(G.winT>2.2&&!G.winDone){G.winDone=true;finishWin()}
  }
}
function endShot(){
  if(G.state==='win'||G.state==='lose')return;
  for(const b of G.balls){spawnDust(b.x,b.y,3,'rgba(255,255,255,');world.remove(b)}G.balls.length=0;G.lead=null;$('#abil').classList.remove('on');
  updateTgt();
  if(G.slimes===0){beginWin();return}
  if(!G.queue.length){G.state='lose';G.loseT=0;bigBanner('弹药耗尽');SFX.lose();vib([60,40,60]);setTimeout(()=>{if(G&&G.state==='lose')showResult(false)},1200);return}
  nextBall();
}
function finishWin(){
  const left=G.queue.length+(G.cur?1:0);
  addScore(left*2000);
  const used=G.used,par=LV.par;const stars=used<=par?3:used<=par+1?2:1;
  showResult(true,stars,left);
}

function buildLevels(){
  const box=$('#lvScroll');box.innerHTML='';$('#lvStars').textContent='★ '+totalStars()+' / '+NLV*3;
  let curEl=null;
  for(let w=0;w<4;w++){
    const h=document.createElement('div');h.className='world';h.textContent=CHAP[w];box.appendChild(h);

      else{if(n===save.unlocked&&!st){b.classList.add('cur');curEl=b}
        let s='';for(let k=0;k<3;k++)s+=starSVG(k<st);b.innerHTML='<span>'+n+'</span><span class="ss">'+s+'</span>';

function wpos(e){const r=gcv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/K,y:(e.clientY-r.top)/K}}
gcv.addEventListener('pointerdown',e=>{
  if(paused||!G)return;audioInit();e.preventDefault();try{gcv.setPointerCapture(e.pointerId)}catch(_){}
  const p=wpos(e);
  if(G.state==='aim'&&G.cur){if(Math.hypot(p.x-SX,p.y-SY)<95){G.pull={x:SX,y:SY};movePull(p);SFX.click();hideTip()}}
  else if(G.state==='fly')useAbility();
});
gcv.addEventListener('pointermove',e=>{if(G&&G.pull&&!paused){e.preventDefault();movePull(wpos(e))}});
function movePull(p){
  let dx=p.x-SX,dy=p.y-SY;const L=Math.hypot(dx,dy),M=62;if(L>M){dx*=M/L;dy*=M/L}
  const r=BALL[G.cur].r;let y=SY+dy;if(y>GY-r-2)y=GY-r-2;const old=G.pull;G.pull={x:SX+dx,y};
  if(old&&Math.abs(Math.hypot(dx,dy)-Math.hypot(old.x-SX,old.y-SY))>2&&Math.random()<.25)SFX.stretch(Math.hypot(dx,dy)/M);
}
function release(){
  if(!G||!G.pull)return;const p=G.pull;G.pull=null;
  if(G.state!=='aim'||!G.cur)return;
  if(Math.hypot(p.x-SX,p.y-SY)<16){return}
  launch(p.x,p.y);
}
gcv.addEventListener('pointerup',release);gcv.addEventListener('pointercancel',()=>{if(G)G.pull=null});

/* ---- 特效更新 ---- */
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='dust'){p.vx*=.96;p.vy*=.96}if(p.rot!==undefined)p.rot+=(p.vr||0)*dt;if(p.k==='deb'&&p.y>GY-2&&p.vy>0){p.y=GY-2;p.vy*=-.35;p.vx*=.6}}
  if(parts.length>600)parts.splice(0,parts.length-600);
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.age+=dt;f.y-=(f.big?10:34)*dt;if(f.age>=f.life)floats.splice(i,1)}
  for(let i=rings.length-1;i>=0;i--){rings[i].age+=dt;if(rings[i].age>=rings[i].dur)rings.splice(i,1)}
  shakeA*=Math.pow(.0015,dt);if(shakeA<.2)shakeA=0;
  if(G){if(G.shown<G.score){G.shown=Math.min(G.score,G.shown+Math.max(3,(G.score-G.shown)*dt*8)|0);$('#hScore').textContent=G.shown}}
}

/* ---- 标题场景 ---- */
const tcv=$('#tcv'),tctx=tcv.getContext('2d');let TS=null;
function titleLayout(){
  const r=$('#title').getBoundingClientRect();if(!r.width)return;
  fitView(r,h=>h*.66);
  tcv.width=Math.round(VW*DPR);tcv.height=Math.round(VH*DPR);
}
function titleReset(){
  world=new World();_seed=12345;parts.length=0;
  world.add(mkBody({type:'box',x:WW/2,y:GY+80,hw:900,hh:80,static:true,fric:.9,rest:.02,ud:{kind:'ground'}}));
  world.add(mkBody({type:'box',x:Math.max(WW,XR)+16,y:GY-700,hw:16,hh:720,static:true,ud:{kind:'wall'}}));
  const t=house(282,0,2,{mats:['stone','wood'],slimes:[1,1],w:84});addSlime(282,t);addBox(205,0,26,26,'tnt');addSlime(205,26);
  TS={t:-1.2,fired:false,ball:null};
  for(let i=0;i<260;i++)world.step(STEP);
}
function titleFrame(dt){
  if(!TS||!world)return;TS.t+=dt;
  if(TS.t>0&&!TS.fired){TS.fired=true;const b=mkBody({type:'circle',x:SX,y:SY,r:13,density:3.2,rest:.25,fric:.4,ud:{kind:'ball',type:'ball',trail:[],hp:999,hurt:0}});b.vx=560;b.vy=-405;world.add(b);TS.ball=b;SFX&&0}
  const n=Math.max(1,Math.round(dt/STEP));for(let i=0;i<Math.min(n,8);i++){world.step(STEP);
    for(const ev of world.events){if(ev.vn>380)for(const b of [ev.a,ev.b]){const u=b.ud;if(!b.static&&u.kind==='block'||u.kind==='slime'){u.hp-=(ev.vn-300)*.5;u.hurt=.3;if(u.hp<=0&&!b.dead){if(u.kind==='slime'){spawnStars(b.x,b.y,12,['#6be36a','#d9ffb8','#ffe14d']);ringFx(b.x,b.y,40,'#d9ffb8',.4)}else{spawnDebris(b.x,b.y,u.mat,8,b.vx,b.vy,200);spawnDust(b.x,b.y,4)}if(u.mat==='tnt'){ringFx(b.x,b.y,100,'#ffd24a',.5);spawnStars(b.x,b.y,20,['#ffd24a','#ff7a3a']);for(const o of world.bodies){if(!o.static&&o!==b){const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1;if(d<130){o.vx+=dx/d*500*(1-d/150);o.vy+=dy/d*500*(1-d/150)-100}}}}world.remove(b)}}}}}
  for(const b of world.bodies){if(b.ud.kind==='ball'){b.ud.trail.push(b.x,b.y);if(b.ud.trail.length>36)b.ud.trail.splice(0,2);if(b.x>XR+80||b.y>Hh)world.remove(b)}}
  updateFx(dt);
  if(TS.t>6.5)titleReset();
  const c=tctx;c.setTransform(DPR,0,0,DPR,0,0);drawBG(c,0,timeS);c.setTransform(DPR*K,0,0,DPR*K,DPR*OX,0);
  drawGround(c,0);G0=null;
  drawSlingStatic(c);
  for(const b of world.bodies)if(b.ud.kind==='block')drawBlock(c,b,timeS);
  for(const b of world.bodies)if(b.ud.kind==='slime')drawSlime(c,b,timeS);
  for(const b of world.bodies)if(b.ud.kind==='ball'){const tr=b.ud.trail;c.fillStyle='#fff';for(let i=0;i<tr.length;i+=4){c.globalAlpha=i/tr.length*.7;c.beginPath();c.arc(tr[i],tr[i+1],2+i/tr.length*3,0,7);c.fill()}c.globalAlpha=1;drawBallBody(c,'ball',b.x,b.y,b.r,b.rot,timeS,'n')}
  if(!TS.fired||TS.t<.1)drawBallBody(c,'ball',SX,SY,13,0,timeS,'n');
  drawFxOnly(c);
}
let G0=null;
function drawSlingStatic(c){const sg=G;G=null;drawSling(c,true);drawSling(c,false);G=sg}
function drawFxOnly(c){
  for(const p of parts){const a=1-p.life/p.max;c.globalAlpha=Math.max(0,a);
    if(p.k==='deb'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}
    else if(p.k==='dust'){c.fillStyle=p.col+(a*.55)+')';c.beginPath();c.arc(p.x,p.y,p.r*(1.4-a*.6),0,7);c.fill()}
    else{c.fillStyle=p.col;star4(c,p.x,p.y,p.r*(.5+a),p.rot)}}
  c.globalAlpha=1;
  for(const r of rings){const p=r.age/r.dur;c.globalAlpha=1-p;c.strokeStyle=r.col;c.lineWidth=6*(1-p)+1;c.beginPath();c.arc(r.x,r.y,r.R*(1-Math.pow(1-p,2)),0,7);c.stroke()}c.globalAlpha=1;
}

/* ---- 主循环 ---- */
let lastTs=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-lastTs)/1000||.016);lastTs=ts;timeS+=dt;
  if(curScr==='game'&&G&&world&&!paused){
    acc+=dt*G.slow;let n=0;while(acc>=STEP&&n<14){logicStep(STEP);acc-=STEP;n++}if(n>=14)acc=0;
    updateFx(dt);draw();
  }else if(curScr==='game'&&G&&world){draw()}
  else if(curScr==='title')titleFrame(dt);
}
/* ---- 调试 / 求解器 ---- */
function headStart(n){startLevel(n);let k=0;while(G.state==='settle'&&k++<400)logicStep(STEP);parts.length=0;floats.length=0;rings.length=0}
function doShot(c){
  if(G.state!=='aim')return false;const L=62*c.p,a=c.a*Math.PI/180;
  launch(SX-Math.cos(a)*L,SY+Math.sin(a)*L);let k=0,used=false;
  while(G.state==='fly'&&k++<3000){if(c.t>=0&&!used&&G.flyT>=c.t){used=true;useAbility()}logicStep(STEP)}
  parts.length=0;floats.length=0;rings.length=0;return true;
}
function cands(type){
  const out=[];const A=[],P=type==='ball'||type==='heavy'?[.6,.8,1]:[.7,1];
  for(let a=8;a<=78;a+=type==='ball'||type==='heavy'?5:6)A.push(a);
  const T=type==='split'?[.25,.45,.7]:type==='dash'?[.1,.3,.55]:type==='bomb'?[-1,.5]:[-1];
  for(const a of A)for(const p of P)for(const t of T)out.push({a,p,t});return out;
}
function solveLevel(n,deadline){
  const plan=[];const lv=LEVELS[n-1];
  for(let s=0;s<lv.shots.length;s++){
    let best=null,bs=-1e9;const type=lv.shots[s];
    for(const c of cands(type)){
      headStart(n);for(const q of plan)doShot(q);
      const s0=cntSlimes(),d0=G.destroyed;doShot(c);
      const left=cntSlimes();let sc=(s0-left)*1000+(G.destroyed-d0)*8;if(left===0)sc+=1e6;
      if(sc>bs){bs=sc;best=c}
      if(left===0)break;
    }
    plan.push(best);
    headStart(n);for(const q of plan)doShot(q);
    if(cntSlimes()===0)return{n,win:true,shots:plan.length,par:lv.par,total:lv.shots.length,plan};
  }
  return{n,win:false,left:cntSlimes(),plan,total:lv.shots.length};
}
window.__pg={G:()=>G,world:()=>world,start:startLevel,headStart,doShot,solveLevel,cntSlimes,LEVELS,logicStep,save:()=>save,show};
/* boot */
MUS.init({bpm:128,root:62,scale:[0,3,5,7,10],spb:8,seed:11,rest:.35,vol:.42,prog:[[0,3,7],[-4,0,3],[-2,2,5],[-5,-2,2]],bass:[1,0,0,1,0,1,0,0],bassWave:'sawtooth',arp:[1,0,1,0,1,0,1,1],arpWave:'square',melody:true,leadWave:'triangle',leadBell:true,drums:{k:[1,0,0,0,1,0,0,0],s:[0,0,1,0,0,0,1,0],h:[1,1,1,1,1,1,1,1]}});
setLabels();show('title');requestAnimationFrame(frame);
window.addEventListener('resize',()=>{if(curScr==='title')titleLayout()});
</script>
