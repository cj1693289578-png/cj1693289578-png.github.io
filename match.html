<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7a5cff">
<title>萌果大爆炸</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#6a4ad0,#2b1a60);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;color:#fff}
#rot{position:fixed;inset:0;z-index:99;background:#2b1a60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:22px;font-weight:900;text-align:center}#rot i{font-size:56px;font-style:normal}
@media (orientation:landscape) and (max-height:520px){#rot{display:flex}}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#58c4ff 0%,#8f8bff 52%,#ff8fd0 100%)}
.scr{position:absolute;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.btn{border:0;font:inherit;font-weight:900;cursor:pointer;color:#7a3b00;background:linear-gradient(#fff08a,#ffbf25);border-radius:999px;padding:14px 34px;font-size:22px;box-shadow:0 5px 0 #c97a00,0 10px 18px rgba(80,20,100,.35);text-shadow:0 1px 0 rgba(255,255,255,.6);transition:transform .08s,box-shadow .08s;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c97a00,0 4px 8px rgba(80,20,100,.3)}
.btn.blue{background:linear-gradient(#9ee7ff,#3aa7ff);color:#04386b;box-shadow:0 5px 0 #1c6cc0,0 10px 18px rgba(20,40,120,.35);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.blue:active{box-shadow:0 1px 0 #1c6cc0}
.btn.green{background:linear-gradient(#b8ff8a,#3fcf4c);color:#0b4a12;box-shadow:0 5px 0 #1f8f2c,0 10px 18px rgba(20,80,40,.35)}
.btn.green:active{box-shadow:0 1px 0 #1f8f2c}
.btn.pink{background:linear-gradient(#ffb3d9,#ff4fa3);color:#6b0a3a;box-shadow:0 5px 0 #b3236f,0 10px 18px rgba(120,20,80,.35)}
.btn.pink:active{box-shadow:0 1px 0 #b3236f}
.btn.sm{font-size:16px;padding:9px 18px}
.btn.big{font-size:30px;padding:18px 56px}
.btn[disabled]{filter:grayscale(.8);opacity:.6;pointer-events:none}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;font-size:22px;font-weight:900;color:#fff;background:rgba(60,30,120,.55);box-shadow:0 3px 0 rgba(40,10,90,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(40,10,90,.6)}
.ibtn svg{width:22px;height:22px;fill:#fff}
/* title */
#title{background:radial-gradient(circle at 50% 30%,#ffe9a8 0,#ffb7e6 28%,#9a8bff 62%,#4c7dff 100%)}
#bgf{position:absolute;inset:0;pointer-events:none}
#bgf img{position:absolute;width:56px;height:56px;opacity:.55;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-90px) rotate(0)}to{transform:translateY(960px) rotate(360deg)}}
.logo{position:absolute;top:11%;left:0;right:0;text-align:center}
.logo .sub{font-size:17px;letter-spacing:10px;font-weight:800;color:#fff;text-shadow:0 2px 0 #7a3fd0;margin-bottom:6px}
.logo h1{margin:0;font-size:78px;line-height:1.02;font-weight:900;color:#fff;letter-spacing:2px;-webkit-text-stroke:7px #7b2ed6;paint-order:stroke fill;text-shadow:0 8px 0 #5a1fa8,0 14px 24px rgba(60,10,120,.5);animation:bob 2.4s ease-in-out infinite}
.logo h1 span:nth-child(2){color:#ffe14d}
@keyframes bob{50%{transform:translateY(-8px) scale(1.02)}}
#heroes{position:absolute;top:47%;left:0;right:0;display:flex;justify-content:center;gap:2px}
#heroes img{width:56px;height:56px;animation:hop 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(60,10,120,.35))}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-16px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}}
.tbtns{position:absolute;bottom:17%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:20px}
.trow{display:flex;gap:12px}
.tfoot{position:absolute;bottom:3.5%;left:0;right:0;text-align:center;font-size:12px;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tpulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
/* map */
#map{background:linear-gradient(180deg,#a8e6ff,#c6b6ff 50%,#ffc0e4)}
.mapbar{position:absolute;top:0;left:0;right:0;height:62px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(80,40,160,.85),rgba(80,40,160,.55));z-index:3;font-weight:900;font-size:20px}
.mapbar .st{background:rgba(0,0,0,.28);padding:6px 14px;border-radius:99px;color:#ffe55c;font-size:17px}
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;width:100%}
#mapInner svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:0;font:inherit;font-size:24px;font-weight:900;color:#7a3b00;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffbf25);box-shadow:0 5px 0 #c97a00,0 8px 12px rgba(80,20,100,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.node.done{background:radial-gradient(circle at 35% 30%,#d8ffc0,#3fcf4c);color:#0b4a12;box-shadow:0 5px 0 #1f8f2c,0 8px 12px rgba(20,80,40,.3)}
.node.lock{background:radial-gradient(circle at 35% 30%,#e3e3ee,#9a98b5);color:#6a6890;box-shadow:0 5px 0 #6c6a8c;cursor:default}
.node.cur{animation:pulse 1.2s ease-in-out infinite;background:radial-gradient(circle at 35% 30%,#ffd1ec,#ff4fa3);color:#fff;box-shadow:0 5px 0 #b3236f,0 0 0 6px rgba(255,255,255,.55),0 8px 16px rgba(120,20,80,.4);text-shadow:0 2px 0 #b3236f}
.node .nst{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;letter-spacing:-1px;text-shadow:0 1px 2px rgba(0,0,0,.5);color:#ffd93b}
.node .nst i{font-style:normal;color:rgba(70,50,110,.45)}
.node .nst b{font-weight:400;color:#ffd93b}
/* game */
#game{background:linear-gradient(180deg,#5cc7ff 0%,#8e8cff 55%,#ff90d2 100%)}
#shake{position:absolute;inset:0}
#cv,#fx{position:absolute;inset:0;width:100%;height:100%}
#cv{touch-action:none}
#fx{pointer-events:none;z-index:6}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;z-index:4;pointer-events:none}
#hud button{pointer-events:auto}
.hrow1{display:flex;align-items:center;justify-content:space-between}
.htitle{font-size:20px;font-weight:900;text-shadow:0 2px 0 #5b2fb0,0 0 8px rgba(80,30,160,.6);letter-spacing:1px}
.hrow2{display:flex;align-items:stretch;gap:8px;margin-top:8px}
.card{background:rgba(70,35,140,.55);border-radius:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);padding:6px 10px;text-align:center}
.card small{display:block;font-size:12px;opacity:.85;font-weight:700}
.card .v{font-size:28px;font-weight:900;line-height:1.05;text-shadow:0 2px 0 rgba(40,10,90,.6)}
#cMoves{width:74px}
#cMoves.low .v{color:#ff6b6b;animation:pulse .6s infinite}
#cScore{width:92px}
#cScore .v{font-size:23px;padding-top:3px}
#goals{flex:1;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;background:rgba(70,35,140,.55);border-radius:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);padding:4px 6px;min-height:62px}
.goal{display:flex;flex-direction:column;align-items:center;min-width:46px;position:relative}
.goal img{width:30px;height:30px}
.goal .n{font-size:15px;font-weight:900;text-shadow:0 1px 0 rgba(40,10,90,.7)}
.goal.done .n{color:#8dff7a}
.goal.pop{animation:gpop .3s}
@keyframes gpop{40%{transform:scale(1.35)}}
.goal.wide{min-width:88px}
.goal.wide .n{font-size:16px}
#boosters{position:absolute;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:22px;padding:0 10px calc(14px + env(safe-area-inset-bottom))}
.bst{width:74px;border:0;background:none;font:inherit;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
.bst .ic{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffb21e);box-shadow:0 4px 0 #c97a00,0 8px 12px rgba(60,20,100,.35);display:flex;align-items:center;justify-content:center}
.bst .ic svg{width:34px;height:34px}
.bst:active .ic{transform:translateY(3px)}
.bst.on .ic{background:radial-gradient(circle at 35% 30%,#ffd1ec,#ff4fa3);box-shadow:0 0 0 4px #fff,0 4px 0 #b3236f;animation:pulse .7s infinite}
.bst .lb{font-size:13px;font-weight:800;text-shadow:0 1px 2px rgba(40,10,90,.8)}
.bst .ct{position:absolute;top:-4px;right:6px;min-width:24px;height:24px;border-radius:12px;background:#ff3d6e;border:2px solid #fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bst.zero .ct{background:#8a86a8}
.bst.zero .ic{filter:grayscale(.7);opacity:.8}
/* modals */
.modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(30,10,70,.62);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.panel{width:84%;max-width:340px;border-radius:28px;padding:26px 20px 22px;text-align:center;background:linear-gradient(#a99bff,#7a5cff);box-shadow:0 0 0 5px #fff,0 0 0 9px #5b3fd0,0 18px 40px rgba(20,0,60,.6);position:relative;animation:pin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.panel h2{margin:-52px auto 14px;display:inline-block;padding:9px 30px;font-size:26px;font-weight:900;background:linear-gradient(#ffb3d9,#ff4fa3);border-radius:99px;box-shadow:0 4px 0 #b3236f,0 0 0 3px #fff;text-shadow:0 2px 0 #b3236f;letter-spacing:2px}
.panel p{margin:8px 0;font-size:16px;line-height:1.5}
.panel .col{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:16px}
.panel .col .btn{min-width:180px}
.tipbox{background:rgba(255,255,255,.2);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.5;margin:10px 0;text-align:left}
.pgoals{display:flex;justify-content:center;gap:16px;margin:10px 0;flex-wrap:wrap}
.pgoals .goal{min-width:56px}
.pgoals .goal img{width:44px;height:44px}
.pgoals .goal .n{font-size:20px}
.bigstars{display:flex;justify-content:center;gap:4px;margin:2px 0 6px;height:84px}
.bigstars svg{width:78px;height:78px;transform:scale(0);filter:drop-shadow(0 4px 0 rgba(90,50,0,.35))}
.bigstars svg:nth-child(2){margin-top:-12px}
.bigstars svg.on{animation:starin .55s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes starin{from{transform:scale(3) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.score-big{font-size:40px;font-weight:900;color:#ffe55c;text-shadow:0 3px 0 #a35b00}
.reward{background:rgba(255,255,255,.22);border-radius:99px;display:inline-block;padding:6px 16px;font-weight:800;margin-top:4px}
.togrow{display:flex;gap:6px;justify-content:center;margin-top:6px}.togrow .btn{min-width:0!important;padding:8px 9px;font-size:14px;white-space:nowrap}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,0);z-index:30;background:rgba(40,10,90,.82);padding:10px 20px;border-radius:99px;font-weight:800;font-size:17px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
#toast.on{opacity:1;transform:translate(-50%,10px)}
</style>
</head>
<body>
<div id="app">
 <section id="title" class="scr on">
  <div id="bgf"></div>
  <div class="logo"><div class="sub">萌 果 星 球</div><h1><span>萌果</span><br><span>大爆炸</span></h1></div>
  <div id="heroes"></div>
  <div class="tbtns">
   <button class="btn big tpulse" id="btnPlay">开始游戏</button>
   <div class="trow"><button class="btn sm blue" id="tSound">音效：开</button><button class="btn sm blue" id="tMusic">音乐：开</button><button class="btn sm blue" id="tVib">震动：开</button></div><button class="btn sm pink" id="tReset" style="font-size:13px;padding:6px 14px;opacity:.85;margin-top:-4px">清除存档</button>
  </div>
  <div class="tfoot">交换相邻水果 · 三消爆炸 · 通关 48 关</div>
 </section>
 <section id="map" class="scr">
  <div class="mapbar"><button class="ibtn" id="mapBack">‹</button><div>闯关地图</div><div class="st" id="mapStars">★ 0</div></div>
  <div id="mapScroll"><div id="mapInner"></div></div>
 </section>
 <section id="game" class="scr">
  <div id="shake">
   <canvas id="cv"></canvas>
   <div id="hud">
    <div class="hrow1"><button class="ibtn" id="btnPause" aria-label="暂停"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button><div class="htitle" id="hTitle">第1关</div><button class="ibtn" id="btnSnd" aria-label="音效">♪</button></div>
    <div class="hrow2">
     <div class="card" id="cMoves"><small>步数</small><div class="v" id="vMoves">0</div></div>
     <div id="goals"></div>
     <div class="card" id="cScore"><small>分数</small><div class="v" id="vScore">0</div></div>
    </div>
   </div>
   <div id="boosters">
    <button class="bst" id="bHammer"><div class="ic"><svg viewBox="0 0 32 32"><rect x="14" y="12" width="5" height="18" rx="2" fill="#8a4b1d" transform="rotate(35 16 20)"/><rect x="5" y="3" width="18" height="11" rx="3" fill="#6b6f8d" transform="rotate(35 14 8)"/><rect x="5" y="3" width="18" height="4" rx="2" fill="#a9aec9" transform="rotate(35 14 8)"/></svg></div><span class="lb">锤子</span><span class="ct">3</span></button>
    <button class="bst" id="bShuffle"><div class="ic"><svg viewBox="0 0 32 32" fill="none" stroke="#7a3b00" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h13l-4-4M27 10h-3M5 22h3M27 22H14l4 4"/><path d="M18 10l9 12M5 22l5-6.5"/></svg></div><span class="lb">洗牌</span><span class="ct">3</span></button>
    <button class="bst" id="bPlus"><div class="ic"><svg viewBox="0 0 32 32"><text x="16" y="23" text-anchor="middle" font-size="19" font-weight="900" fill="#7a3b00" font-family="sans-serif">+5</text></svg></div><span class="lb">加5步</span><span class="ct">2</span></button>
   </div>
  </div>
  <canvas id="fx"></canvas>
 </section>
 <div class="modal" id="pre"><div class="panel"><h2 id="preTitle">第1关</h2>
   <div class="tipbox" id="preTip"></div>
   <div style="font-weight:800;font-size:15px">通关目标</div><div class="pgoals" id="preGoals"></div>
   <p>步数限制：<b id="preMoves">0</b></p>
   <div class="col"><button class="btn green big" id="preGo" style="font-size:26px;padding:14px 40px">开始！</button><button class="btn sm blue" id="preBack">返回地图</button></div></div></div>
 <div class="modal" id="pause"><div class="panel"><h2>游戏暂停</h2>
   <div class="col"><button class="btn green" id="pResume">继续游戏</button><button class="btn blue" id="pRestart">重新开始</button><button class="btn pink" id="pQuit">返回地图</button>
   <div class="togrow"><button class="btn sm blue" id="pSound">音效：开</button><button class="btn sm blue" id="pMusic">音乐：开</button><button class="btn sm blue" id="pVib">震动：开</button></div></div></div></div>
 <div class="modal" id="result"><div class="panel"><h2 id="resTitle">过关！</h2>
   <div class="bigstars" id="resStars"></div>
   <div id="resBody"></div>
   <div class="col" id="resBtns"></div></div></div>
 <div id="toast"></div>
</div>
<div id="rot"><i>📱</i>请竖屏游玩</div>
<script>

  quality=2,w=PI2*abs(filter)*2/sampleRate,cos=Math.cos(w),alpha=Math.sin(w)/2/quality,a0=1+alpha,a1=-2*cos/a0,a2=(1-alpha)/a0,

      s=delay?s/2+(delay>i?0:(i<length-delay?1:(length-i)/delay)*b[i-delay|0]/2/volume):s;

/* ===== 程序化背景音乐引擎（自研：和弦进行 + 低音 + 琶音 + 旋律 + 鼓点，Web Audio 前瞻调度）===== */

function findRuns(){
  const runs=[];
  for(let r=0;r<H;r++){let c=0;while(c<W){const t=tt(r,c);if(t<0){c++;continue}let e=c;while(e+1<W&&tt(r,e+1)===t)e++;if(e-c>=2){const cells=[];for(let i=c;i<=e;i++)cells.push(key(r,i));runs.push({dir:'h',t,cells})}c=e+1}}
  for(let c=0;c<W;c++){let r=0;while(r<H){const t=tt(r,c);if(t<0){r++;continue}let e=r;while(e+1<H&&tt(e+1,c)===t)e++;if(e-r>=2){const cells=[];for(let i=r;i<=e;i++)cells.push(key(i,c));runs.push({dir:'v',t,cells})}r=e+1}}

}
function planMatches(swapKeys){

  const par=runs.map((_,i)=>i);const f=i=>par[i]===i?i:(par[i]=f(par[i]));
  for(let i=0;i<runs.length;i++)for(let j=i+1;j<runs.length;j++){if(runs[i].t===runs[j].t&&runs[i].cells.some(k=>runs[j].cells.includes(k)))par[f(i)]=f(j)}
  const groups={};runs.forEach((r,i)=>{(groups[f(i)]=groups[f(i)]||[]).push(r)});
  const clr=new Set(),make=[];
  Object.values(groups).forEach(rs=>{
    const cells=new Set();rs.forEach(r=>r.cells.forEach(k=>cells.add(k)));cells.forEach(k=>clr.add(k));
    const maxLen=Math.max(...rs.map(r=>r.cells.length));const hasH=rs.some(r=>r.dir==='h'),hasV=rs.some(r=>r.dir==='v');
    let kind=0;
    if(maxLen>=5)kind=4;else if(hasH&&hasV)kind=3;else if(maxLen===4)kind=rs[0].dir==='h'?2:1;
    if(!kind)return;
    const ok=k=>!g[k/W|0][k%W].s;
    let pos=null;
    if(swapKeys){for(const k of swapKeys)if(cells.has(k)&&ok(k)){pos=k;break}}
    if(pos===null&&kind===3){for(const a of rs.filter(r=>r.dir==='h'))for(const k of a.cells)if(rs.some(b=>b.dir==='v'&&b.cells.includes(k))&&ok(k)){pos=k;break}}
    if(pos===null){const lr=rs.slice().sort((a,b)=>b.cells.length-a.cells.length)[0];const mid=lr.cells[Math.floor(lr.cells.length/2)];if(ok(mid))pos=mid;else pos=lr.cells.find(ok)??null}
    if(pos!==null)make.push({r:pos/W|0,c:pos%W,s:kind});
  });
  make.forEach(m=>clr.delete(key(m.r,m.c)));
  return {clr,make,pre:null};
}
function hasMatchAt(r,c){
  const t=tt(r,c);if(t<0)return false;
  let n=1,i=c-1;while(tt(r,i)===t){n++;i--}i=c+1;while(tt(r,i)===t){n++;i++}if(n>=3)return true;
  n=1;i=r-1;while(tt(i,c)===t){n++;i--}i=r+1;while(tt(i,c)===t){n++;i++}return n>=3;
}
function swapG(r1,c1,r2,c2){const a=g[r1][c1];g[r1][c1]=g[r2][c2];g[r2][c2]=a}
function listMoves(){
  const res=[];

    for(const [dr,dc] of [[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;if(r2>=H||c2>=W)continue;
      const A=g[r][c],B=g[r2][c2];if(!A||!B||A.ice||B.ice)continue;
      if(A.s||B.s){res.push({a:[r,c],b:[r2,c2],sc:(A.s&&B.s)?60:(A.s===4||B.s===4?40:14)});continue}
      swapG(r,c,r2,c2);
      if(hasMatchAt(r,c)||hasMatchAt(r2,c2)){const p=planMatches([key(r,c),key(r2,c2)]);res.push({a:[r,c],b:[r2,c2],sc:(p?p.clr.size:3)+p.make.length*8+p.make.reduce((s,m)=>s+(m.s===4?6:0),0)})}

function commonColor(){const n=new Array(6).fill(0);for(let r=0;r<H;r++)for(let c=0;c<W;c++){const t=g[r][c];if(t&&t.t>=0)n[t.t]++}return n.indexOf(Math.max(...n))}
function expand(clr,pre){
  const all=new Set(clr),trig=new Set(pre||[]),fxl=[],q=[...all];let specials=0;
  const add=(r,c)=>{if(r<0||c<0||r>=H||c>=W)return;const k=key(r,c);if(!all.has(k)){all.add(k);q.push(k)}};
  while(q.length){
    const k=q.pop(),r=k/W|0,c=k%W,t=g[r][c];if(!t||!t.s||trig.has(t))continue;trig.add(t);specials++;
    if(t.s===1){for(let i=0;i<W;i++)add(r,i);fxl.push({k:'row',r,c})}
    else if(t.s===2){for(let i=0;i<H;i++)add(i,c);fxl.push({k:'col',r,c})}
    else if(t.s===3){for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)if(Math.abs(dr)+Math.abs(dc)<=3)add(r+dr,c+dc);fxl.push({k:'ring',r,c})}

    if(O.s===4){addAll();pre.push(A,B);return {clr,pre,label:'彩虹风暴!'}}
    if(O.s>0){const col=O.t;addAll(t=>t.t===col);clr.add(key(pR[0],pR[1]));
      for(let r=0;r<H;r++)for(let c=0;c<W;c++){const t=g[r][c];if(t&&t.t===col&&t!==R)t.s=O.s===3?3:(Math.random()<.5?1:2)}

    R.rc=O.t;clr.add(key(pR[0],pR[1]));addAll(t=>t.t===O.t);return {clr,pre,label:null};
  }
  if(sa&&sb){
    const [r,c]=pb;
    if(sa===3&&sb===3){for(let dr=-3;dr<=3;dr++)for(let dc=-3;dc<=3;dc++){const rr_=r+dr,cc=c+dc;if(rr_>=0&&cc>=0&&rr_<H&&cc<W&&Math.abs(dr)+Math.abs(dc)<=4)clr.add(key(rr_,cc))}pre.push(A,B);return {clr,pre,label:'超级爆炸!',ring:[r,c,3.8]}}
    if(sa===3||sb===3){for(let dr=-1;dr<=1;dr++){for(let i=0;i<W;i++)if(r+dr>=0&&r+dr<H)clr.add(key(r+dr,i))}for(let dc=-1;dc<=1;dc++){for(let i=0;i<H;i++)if(c+dc>=0&&c+dc<W)clr.add(key(i,c+dc))}pre.push(A,B);return {clr,pre,label:'巨型条纹!',ring:[r,c,2.5]}}
    for(let i=0;i<W;i++)clr.add(key(r,i));for(let i=0;i<H;i++)clr.add(key(i,c));pre.push(A,B);return {clr,pre,label:'十字消除!',cross:[r,c]};

async function doShuffle(){
  SFX.shuffle();vib([15,20,15]);
  const cells=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++){const t=g[r][c];if(t&&!t.ice)cells.push([r,c,t])}
  let tries=0,ok=false;
  while(!ok&&tries<300){
    tries++;const objs=cells.map(x=>x[2]).slice();for(let i=objs.length-1;i>0;i--){const j=irand(i+1);[objs[i],objs[j]]=[objs[j],objs[i]]}
    cells.forEach((x,i)=>{g[x[0]][x[1]]=objs[i]});
    if(!findRuns().length&&listMoves().length)ok=true;
  }
  if(!ok){cells.forEach(x=>{const t=x[2];if(t.s===0)t.t=irand(L.colors)});let k=0;while((findRuns().length||!listMoves().length)&&k++<200){cells.forEach(x=>{if(!x[2].s)x[2].t=irand(L.colors)})}}
  const ps=[];cells.forEach(x=>{const t=g[x[0]][x[1]];ps.push(tween(t,{x:x[1],y:x[0]},520,'inOut'))});
  // 先飞起来的小动画
  cells.forEach(x=>{const t=g[x[0]][x[1]];t.sc=1.12;tween(t,{sc:1},520,'outQuad')});
  await Promise.all(ps);
}
/* ========= 胜负 ========= */
async function winSeq(){
  ended=true;busy=true;const id=runId;
  const frac=moves/L.moves;const stars=frac>=.35?3:frac>=.18?2:1;
  bigText('目标达成!','#ffe55c');SFX.win();vib([40,40,80]);
  for(let i=0;i<30;i++)burst(rand(0,VW),by-20,['#ff7fc4','#ffe55c','#7fd8ff','#9dff7a'][i%4],4,160,2);
  await sleep(900);if(id!==runId)return;
  let k=0;const left0=moves;
  while(moves>0&&k<10){
    moves--;updateHUD();
    const cand=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++){const t=g[r][c];if(t&&!t.s&&!t.ice&&t.t>=0)cand.push([r,c])}
    if(!cand.length)break;const [r,c]=cand[irand(cand.length)];const t=g[r][c];t.s=1+irand(3);t.sc=1.6;tween(t,{sc:1},300,'outBack');
    SFX.make();ring(cx_(c),cy_(r),'#fff',cell*1.2,.4);addScore(300);
    await sleep(240);if(id!==runId)return;
    await resolve({clr:new Set([key(r,c)]),make:[],pre:null});if(id!==runId)return;
    k++;
  }
  if(moves>0){addScore(moves*200);moves=0;updateHUD()}
  await sleep(700);if(id!==runId)return;
  showResult(true,stars,left0);
}

  await sleep(1000);if(id!==runId)return;

}

/* ========= 道具 ========= */
function useBoost(kind){
  if(busy||ended||paused){return}
  audioInit();
  if(save.boost[kind]<=0){toast('道具用完了，通关有概率获得新道具');SFX.bad();return}
  if(kind==='hammer'){hammerMode=!hammerMode;clearHint();sel=null;SFX.click();updateBoostUI();if(hammerMode)toast('点击一个水果，将它砸碎！');return}
  if(kind==='plus'){save.boost.plus--;moves+=5;persist();SFX.boost();vib(20);floatText(VW/2,by-20,'+5 步','#aaff7a',30,1.2);burst(70,100,'#aaff7a',16,200,1);updateHUD();updateBoostUI();return}
  if(kind==='shuffle'){
    save.boost.shuffle--;persist();busy=true;clearHint();updateBoostUI();
    doShuffle().then(()=>afterMove());
  }
}
async function hammerAt(r,c){
  hammerMode=false;save.boost.hammer--;persist();updateBoostUI();busy=true;clearHint();const id=runId;
  SFX.hammer();vib(40);shake(8);ring(cx_(c),cy_(r),'#fff',cell*1.6,.4);
  await resolve({clr:new Set([key(r,c)]),make:[],pre:null});if(id!==runId)return;
  await afterMove();
}

function cellAt(x,y){const c=Math.floor((x-bx)/cell),r=Math.floor((y-by)/cell);return (r>=0&&r<H&&c>=0&&c<W)?[r,c]:null}
cv.addEventListener('pointerdown',e=>{
  audioInit();if(busy||ended||paused)return;
  const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top,p=cellAt(x,y);if(!p)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(hammerMode){hammerAt(p[0],p[1]);return}
  hintT=0;hint=null;
  if(sel&&Math.abs(sel[0]-p[0])+Math.abs(sel[1]-p[1])===1){const s=sel;sel=null;ptr=null;trySwap(s[0],s[1],p[0],p[1]);return}
  ptr={r:p[0],c:p[1],x,y,moved:false,wasSel:sel&&sel[0]===p[0]&&sel[1]===p[1]};
  sel=[p[0],p[1]];SFX.click();
});
cv.addEventListener('pointermove',e=>{
  if(!ptr||ptr.moved||busy||ended||paused)return;
  const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top,dx=x-ptr.x,dy=y-ptr.y;
  if(Math.hypot(dx,dy)<cell*.38)return;
  ptr.moved=true;let r2=ptr.r,c2=ptr.c;
  if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1;
  const r1=ptr.r,c1=ptr.c;sel=null;ptr=null;
  if(r2>=0&&r2<H&&c2>=0&&c2<W)trySwap(r1,c1,r2,c2);
});
const upH=()=>{if(ptr&&!ptr.moved&&ptr.wasSel)sel=null;ptr=null};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',()=>{ptr=null});
/* ========= 更新 ========= */
function update(dt){
  time+=dt;
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.t-=dt*1000;if(t.t<=0){timers.splice(i,1);t.res()}}
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const p=Math.min(1,w.t/w.d),e=w.e(p);for(const k in w.to)w.o[k]=w.from[k]+(w.to[k]-w.from[k])*e;if(p>=1){tweens.splice(i,1);w.res()}}
  let landed=false;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const t=g[r]&&g[r][c];if(!t)continue;
    if(t.falling){
      if(t.delay>0){t.delay-=dt}
      else{t.vy=Math.min(30,t.vy+75*dt);t.y+=t.vy*dt;if(t.y>=t.ty){const im=t.vy;t.y=t.ty;t.vy=0;t.falling=false;if(im>9){t.sq=.2;t.sqv=0;landed=true}}}
    }
    if(t.sq!==0||t.sqv!==0){t.sqv+=(-t.sq*420-t.sqv*15)*dt;t.sq+=t.sqv*dt;if(Math.abs(t.sq)<.002&&Math.abs(t.sqv)<.05){t.sq=0;t.sqv=0}}
  }
  if(landed&&!FAST)SFX.land();
  for(let i=waiters.length-1;i>=0;i--){const w=waiters[i];if(w.fn()){waiters.splice(i,1);w.res()}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.age+=dt;f.y+=f.vy*dt;if(f.age>=f.life)floats.splice(i,1)}
  for(let i=ghosts.length-1;i>=0;i--){ghosts[i].age+=dt;if(ghosts[i].age>=ghosts[i].dur)ghosts.splice(i,1)}
  for(let i=beams.length-1;i>=0;i--){beams[i].age+=dt;if(beams[i].age>=beams[i].dur)beams.splice(i,1)}
  for(let i=flyers.length-1;i>=0;i--){const f=flyers[i];f.age+=dt;if(f.age>=f.dur){flyers.splice(i,1);shownCol[f.t]++;updateGoalChip(f.id);bumpGoal(f.id);burst(f.x1,f.y1,FR[f.t].c,6,120,1)}}
  if(shakeA>.15){const s=$('#shake').style;s.transform='translate('+((Math.random()-.5)*2*shakeA).toFixed(1)+'px,'+((Math.random()-.5)*2*shakeA).toFixed(1)+'px)';shakeA*=Math.pow(.015,dt)}
  else if(shakeA!==0){shakeA=0;$('#shake').style.transform=''}
  if(Math.abs(score-shownScore)>.5){shownScore+=(score-shownScore)*Math.min(1,dt*9);if(Math.abs(score-shownScore)<1)shownScore=score;$('#vScore').textContent=Math.round(shownScore).toLocaleString('en-US');updateGoalChip('score')}
  if(screen==='game'&&!busy&&!ended&&!hammerMode){hintT+=dt;if(!hint&&hintT>(handOn?.7:5)){const m=bestMove();hint=m?[m.a,m.b]:null}}
}

/* ========= 绘制 ========= */
function star4(c,x,y,r,rot){c.beginPath();for(let i=0;i<8;i++){const a=rot+i*Math.PI/4,rr_=i%2?r*.3:r;c.lineTo(x+Math.cos(a)*rr_,y+Math.sin(a)*rr_)}c.closePath();c.fill()}
function drawRainbow(c,cs){
  const R=cs*.4;
  c.save();c.shadowColor='rgba(255,255,255,.9)';c.shadowBlur=cs*.25;
  for(let i=0;i<6;i++){c.fillStyle=FR[i].c;c.beginPath();c.moveTo(0,0);c.arc(0,0,R,time*1.6+i*Math.PI/3,time*1.6+(i+1)*Math.PI/3);c.closePath();c.fill()}
  c.restore();
  const gr=c.createRadialGradient(-R*.3,-R*.4,R*.05,0,0,R);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.45,'rgba(255,255,255,.25)');gr.addColorStop(1,'rgba(0,0,0,.18)');
  c.fillStyle=gr;c.beginPath();c.arc(0,0,R,0,7);c.fill();c.lineWidth=cs*.05;c.strokeStyle='#fff';c.stroke();
  face(c,0,R*.05,R*1.1);
  c.fillStyle='#fff';for(let i=0;i<3;i++){const a=time*2+i*2.09;star4(c,Math.cos(a)*R*1.05,Math.sin(a)*R*1.05,cs*.1*(.7+.3*Math.sin(time*7+i)),a)}
}
function drawTile(c,t){
  const cs=cell,x=bx+(t.x+.5)*cs,y=by+(t.y+.5)*cs;
  let sc=t.sc,hp=0;
  if(hint&&((hint[0][0]===(t.ty|0)&&hint[0][1]===t.x)||(hint[1][0]===(t.ty|0)&&hint[1][1]===t.x))&&!t.falling)hp=Math.sin(time*8);
  const isSel=sel&&Math.round(t.y)===sel[0]&&Math.round(t.x)===sel[1];
  sc*=1+hp*.07+(isSel?.1+Math.sin(time*10)*.02:0);
  c.save();c.translate(x,y);if(t.rot)c.rotate(t.rot);c.scale(sc*(1+t.sq*.9),sc*(1-t.sq));
  if(t.s){
    const gl=c.createRadialGradient(0,0,cs*.2,0,0,cs*.72);const a=.45+.2*Math.sin(time*6);
    gl.addColorStop(0,'rgba(255,255,255,'+a+')');gl.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gl;c.beginPath();c.arc(0,0,cs*.72,0,7);c.fill();
  }
  if(t.s===4)drawRainbow(c,cs);
  else{
    c.drawImage(SPR[t.t],-cs/2,-cs/2,cs,cs);
    if(t.s===1||t.s===2){
      c.save();rr(c,-cs*.46,-cs*.46,cs*.92,cs*.92,cs*.26);c.clip();
      c.fillStyle='rgba(255,255,255,.62)';
      for(let i=-3;i<=3;i++){const o=((i*cs*.2)+time*cs*.25)%(cs*.8)-cs*.4;if(t.s===1)c.fillRect(-cs/2,o,cs,cs*.075);else c.fillRect(o,-cs/2,cs*.075,cs)}
      c.restore();
      c.fillStyle='#fff';c.strokeStyle='rgba(60,20,100,.5)';c.lineWidth=1.5;
      const off=Math.sin(time*8)*cs*.03;
      for(const k of[-1,1]){c.beginPath();if(t.s===1){const px=k*(cs*.37+off);c.moveTo(px,0);c.lineTo(px-k*cs*.12,-cs*.1);c.lineTo(px-k*cs*.12,cs*.1)}else{const py=k*(cs*.37+off);c.moveTo(0,py);c.lineTo(-cs*.1,py-k*cs*.12);c.lineTo(cs*.1,py-k*cs*.12)}c.closePath();c.fill();c.stroke()}
    }else if(t.s===3){
      c.save();c.rotate(time*1.2);c.fillStyle='#ffb21e';c.strokeStyle='#fff';c.lineWidth=1.5;
      for(let i=0;i<10;i++){c.save();c.rotate(i*Math.PI/5);c.beginPath();c.moveTo(cs*.5,0);c.lineTo(cs*.4,-cs*.07);c.lineTo(cs*.4,cs*.07);c.closePath();c.fill();c.restore()}c.restore();
      c.fillStyle='#fff7a0';star4(c,cs*.3,-cs*.38,cs*.14*(.8+.3*Math.sin(time*14)),time*3);
      c.strokeStyle='rgba(255,200,60,.9)';c.lineWidth=cs*.04;c.beginPath();c.arc(0,0,cs*.43+Math.sin(time*7)*cs*.02,0,7);c.stroke();
    }
  }
  if(t.ice){
    rr(c,-cs*.47,-cs*.47,cs*.94,cs*.94,cs*.2);const gr=c.createLinearGradient(-cs/2,-cs/2,cs/2,cs/2);gr.addColorStop(0,'rgba(235,252,255,.82)');gr.addColorStop(.5,'rgba(160,220,255,.5)');gr.addColorStop(1,'rgba(210,245,255,.78)');
    c.fillStyle=gr;c.fill();c.lineWidth=cs*.04;c.strokeStyle='rgba(255,255,255,.95)';c.stroke();
    c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=cs*.03;c.beginPath();c.moveTo(-cs*.3,-cs*.32);c.lineTo(-cs*.12,-cs*.12);c.lineTo(-cs*.2,cs*.1);c.moveTo(-cs*.12,-cs*.12);c.lineTo(cs*.15,-cs*.05);c.moveTo(cs*.3,cs*.3);c.lineTo(cs*.18,cs*.12);c.stroke();
  }
  c.restore();
}
function drawGame(){
  const c=ctx;c.setTransform(CDPR,0,0,CDPR,0,0);c.clearRect(0,0,VW,VH);
  if(!L)return;
  const bw=cell*W,bh=cell*H;
  c.save();c.shadowColor='rgba(40,10,100,.45)';c.shadowBlur=24;c.shadowOffsetY=8;rr(c,bx-9,by-9,bw+18,bh+18,26);c.fillStyle='rgba(58,28,120,.62)';c.fill();c.restore();
  rr(c,bx-9,by-9,bw+18,bh+18,26);c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.55)';c.stroke();
  for(let r=0;r<H;r++)for(let q=0;q<W;q++){c.fillStyle=(r+q)%2?'rgba(255,255,255,.17)':'rgba(255,255,255,.07)';rr(c,bx+q*cell+1.5,by+r*cell+1.5,cell-3,cell-3,cell*.2);c.fill()}
  c.save();rr(c,bx-4,by-4,bw+8,bh+8,18);c.clip();
  const falling=[],still=[];
  for(let r=0;r<H;r++)for(let q=0;q<W;q++){const t=g[r][q];if(t)(t.falling?falling:still).push(t)}
  still.forEach(t=>drawTile(c,t));falling.forEach(t=>drawTile(c,t));
  for(let r=0;r<H;r++)for(let q=0;q<W;q++){
    const j=jelly[r]&&jelly[r][q];if(!j)continue;
    const x=bx+q*cell,y=by+r*cell,pu=.5+.5*Math.sin(time*3+r+q);
    rr(c,x+1.5,y+1.5,cell-3,cell-3,cell*.2);
    if(j===1){c.fillStyle='rgba(255,100,190,'+(.34+.05*pu)+')';c.fill();c.lineWidth=2.5;c.strokeStyle='rgba(255,230,245,.95)';c.stroke()}
    else{c.fillStyle='rgba(150,60,255,'+(.46+.06*pu)+')';c.fill();c.lineWidth=3.5;c.strokeStyle='rgba(255,255,255,.95)';c.stroke();rr(c,x+5,y+5,cell-10,cell-10,cell*.15);c.lineWidth=1.5;c.setLineDash([4,3]);c.strokeStyle='rgba(255,220,255,.85)';c.stroke();c.setLineDash([])}
    c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(x+cell*.25,y+cell*.17,cell*.11,cell*.05,-.5,0,7);c.fill();
  }
  if(sel){c.lineWidth=3;c.strokeStyle='#fff';c.shadowColor='#fff';c.shadowBlur=10;rr(c,bx+sel[1]*cell+2,by+sel[0]*cell+2,cell-4,cell-4,cell*.24);c.stroke();c.shadowBlur=0}
  c.restore();
}
function drawFx(){
  const c=fctx;c.setTransform(CDPR,0,0,CDPR,0,0);c.clearRect(0,0,VW,VH);
  if(!L)return;
  const bw=cell*W;
  beams.forEach(b=>{
    const p=b.age/b.dur,a=1-p;
    if(b.k==='row'||b.k==='col'){
      const th=cell*(1.1-.7*p);c.save();c.globalAlpha=a;
      if(b.k==='row'){const y=cy_(b.r);const gr=c.createLinearGradient(0,y-th/2,0,y+th/2);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'#fffbd0');gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.fillRect(bx-10,y-th/2,bw+20,th)}
      else{const x=cx_(b.c);const gr=c.createLinearGradient(x-th/2,0,x+th/2,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'#fffbd0');gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.fillRect(x-th/2,by-10,th,cell*H+20)}

      b.tg.forEach(t=>{const e=Math.min(1,p*2.5);const mx=lerp(b.x,t[0],e),my=lerp(b.y,t[1],e);c.beginPath();c.moveTo(b.x,b.y);c.lineTo((b.x+mx)/2+Math.sin(t[0])*8,(b.y+my)/2+Math.cos(t[1])*8);c.lineTo(mx,my);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(t[0],t[1],cell*.3*(1-p)+3,0,7);c.fill()});

    else if(p.type===1)star4(c,p.x,p.y,p.size*1.6*a+1,p.rot);
    else if(p.type===2){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.size/2,-p.size/2,p.size,p.size);c.restore()}
    else{const e=EASE.outQuad(p.life/p.max);c.strokeStyle=p.col;c.lineWidth=5*a+1;c.beginPath();c.arc(p.x,p.y,p.size*e,0,7);c.stroke()}
  });c.globalAlpha=1;
  flyers.forEach(f=>{

    const s=cell*(.75-.35*e);c.save();c.translate(x,y);c.rotate(e*5);c.drawImage(SPR[f.t],-s/2,-s/2,s,s);c.restore();
    if(Math.random()<.5)parts.push({x,y,vx:rand(-20,20),vy:rand(-20,20),g:0,life:0,max:.3,col:'#fff',size:3,type:1,rot:0,vr:3});
  });
  if(handOn&&hint&&!busy&&!ended){

    const x=lerp(cx_(hint[0][1]),cx_(hint[1][1]),k),y=lerp(cy_(hint[0][0]),cy_(hint[1][0]),k);
    c.save();c.globalAlpha=clamp(a,0,1);c.fillStyle='rgba(255,255,255,.88)';c.shadowColor='rgba(60,20,120,.6)';c.shadowBlur=10;c.beginPath();c.arc(x,y,cell*.27,0,7);c.fill();
    c.shadowBlur=0;c.strokeStyle='#ff4fa3';c.lineWidth=3;c.beginPath();c.arc(x,y,cell*.27+5+Math.sin(time*9)*3,0,7);c.stroke();
    c.fillStyle='#ff4fa3';c.beginPath();c.arc(x,y,cell*.09,0,7);c.fill();c.restore();
  }
  if(hammerMode){c.save();c.fillStyle='rgba(255,255,255,.9)';c.font='900 16px sans-serif';c.textAlign='center';c.fillText('点击要砸碎的水果 · 再点锤子取消',VW/2,by-18);c.restore()}
  floats.forEach(f=>{
    const p=f.age/f.life;let a=p>.7?1-(p-.7)/.3:1,sc=1;
    if(f.big){const q=Math.min(1,f.age/.3);sc=EASE.outBack(q)*(1+.05*Math.sin(f.age*6));}
    else sc=p<.15?.6+p/.15*.4:1;
    c.save();c.globalAlpha=Math.max(0,a);c.translate(f.x,f.y);c.scale(sc,sc);c.textAlign='center';c.textBaseline='middle';
    c.font='900 '+f.size+'px "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif';c.lineJoin='round';
    c.lineWidth=f.big?9:5;c.strokeStyle=f.big?'#6a2cc0':'rgba(70,20,120,.85)';c.strokeText(f.text,0,0);c.fillStyle=f.col;c.fillText(f.text,0,0);
    if(f.sub){c.font='900 24px sans-serif';c.lineWidth=6;c.strokeText(f.sub,0,40);c.fillStyle='#fff';c.fillText(f.sub,0,40)}
    c.restore();
  });
}
function draw(){drawGame();drawFx()}

/* ========= HUD ========= */
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function chipId(q){return q.k==='col'?'col'+q.c:q.k}
function goalChipHTML(q,big){
  const id=chipId(q);
  if(q.k==='score')return '<div class="goal wide" data-goal="score"><img src="'+ICON.star+'"><div class="n">0/'+fmt(q.n)+'</div></div>';
  const img=q.k==='col'?ICON.fruit[q.c]:ICON[q.k];
  const n=q.k==='col'?q.n:q.k==='jelly'?jellyLeft:iceLeft;
  return '<div class="goal" data-goal="'+id+'"><img src="'+img+'"><div class="n">'+n+'</div></div>';
}
function updateGoalChip(id){
  if(!L)return;const e=goalEl(id);if(!e)return;const n=e.querySelector('.n');let done=false,txt='';
  if(id==='score'){const q=L.goals.find(x=>x.k==='score');txt=fmt(Math.min(q.n,shownScore))+'/'+fmt(q.n);done=score>=q.n}
  else if(id==='jelly'){txt=jellyLeft;done=jellyLeft<=0}
  else if(id==='ice'){txt=iceLeft;done=iceLeft<=0}
  else{const c=+id.slice(3),q=L.goals.find(x=>x.k==='col'&&x.c===c);const rem=Math.max(0,q.n-shownCol[c]);txt=rem;done=rem<=0}
  n.textContent=done?'✓':txt;e.classList.toggle('done',done);
}
function buildGoals(){
  $('#goals').innerHTML=L.goals.map(q=>goalChipHTML(q)).join('');
}
function updateHUD(){
  $('#vMoves').textContent=moves;$('#cMoves').classList.toggle('low',moves<=5&&moves>0);
  L.goals.forEach(q=>{if(q.k!=='col')updateGoalChip(chipId(q))});
}
function updateBoostUI(){
  [['bHammer','hammer'],['bShuffle','shuffle'],['bPlus','plus']].forEach(([id,k])=>{const b=$('#'+id);b.querySelector('.ct').textContent=save.boost[k];b.classList.toggle('zero',save.boost[k]<=0);b.classList.toggle('on',k==='hammer'&&hammerMode)});
}
let toastT=0;
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
function setToggleLabels(){
  ['tSound','pSound'].forEach(i=>$('#'+i).textContent='音效：'+(save.sound?'开':'关'));
  ['tVib','pVib'].forEach(i=>$('#'+i).textContent='震动：'+(save.vib?'开':'关'));
  ['tMusic','pMusic'].forEach(i=>$('#'+i).textContent='音乐：'+(save.music===0?'关':'开'));
  $('#btnSnd').style.opacity=save.sound?1:.45;
}

/* ========= 关卡启动 ========= */
function zeros(n){return new Array(n).fill(0)}
function initBoard(){
  g=[];
  for(let r=0;r<H;r++){g.push([]);for(let c=0;c<W;c++){let t;do{t=irand(L.colors)}while((c>=2&&g[r][c-1].t===t&&g[r][c-2].t===t)||(r>=2&&g[r-1][c].t===t&&g[r-2][c].t===t));const tl=newTile(t);tl.x=c;tl.ty=r;tl.y=r-H-3;tl.falling=true;tl.delay=(H-1-r)*.035+c*.012;g[r].push(tl)}}
  if(L.ice)L.ice.forEach(([r,c])=>{g[r][c].ice=1});
  let k=0;while(!listMoves().length&&k++<50){for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(!g[r][c].ice)g[r][c].t=irand(L.colors)}}
}
async function startLevel(n){
  resetAsync();const id=runId;
  L=mkLevel(n);save.plays++;persist();
  moves=startMoves=L.moves;score=0;shownScore=0;collected=zeros(6);shownCol=zeros(6);
  jelly=L.jelly?L.jelly.map(r=>r.slice()):Array.from({length:H},()=>zeros(W));
  jellyLeft=0;jelly.forEach(r=>r.forEach(v=>{if(v>0)jellyLeft++}));iceLeft=L.ice?L.ice.length:0;
  ended=false;busy=true;paused=false;hammerMode=false;sel=null;hint=null;hintT=0;maxChain=0;handOn=n===1&&!save.tips.hand;
  closeModals();show('game');layout();
  $('#hTitle').textContent='第'+n+'关';$('#vScore').textContent='0';buildGoals();updateHUD();updateBoostUI();setToggleLabels();
  initBoard();
  await until(()=>!anyFalling());if(id!==runId)return;
  await sleep(200);if(id!==runId)return;
  busy=false;
}
/* ========= 界面 ========= */
let ICON={};
function show(name){screen=name;document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===name))}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
function openModal(id){$('#'+id).classList.add('on')}
const KIND_TIP={score:'在步数用完之前达到目标分数。连消和特殊果能拿到高分！',col:'收集足够数量的目标水果。',col2:'收集两种目标水果，注意步数分配。',jelly:'打碎所有粉色果冻！在果冻格子上消除即可。',jellycol:'打碎果冻并收集目标水果！',ice:'打碎所有冰封果，在它旁边消除同色水果来解冻。'};
function buildTitle(){
  const bg=$('#bgf');let h='';for(let i=0;i<14;i++){const t=i%6;h+='<img src="'+ICON.fruit[t]+'" style="left:'+(i*7.3%96)+'%;animation-duration:'+(9+i%5*2.2)+'s;animation-delay:-'+(i*1.7)+'s;width:'+(36+i%4*10)+'px;height:'+(36+i%4*10)+'px">'}bg.innerHTML=h;
  $('#heroes').innerHTML=[0,1,2,3,4,5].map(t=>'<img src="'+ICON.fruit[t]+'" style="animation-delay:'+(t*.15)+'s">').join('');
  $('#btnPlay').textContent=save.stars.length?'继续游戏':'开始游戏';
}
function buildMap(){
  const inner=$('#mapInner'),SP=92,Hh=NL*SP+260;inner.style.height=Hh+'px';
  const pts=[];for(let i=1;i<=NL;i++)pts.push([50+29*Math.sin((i-1)*.9),Hh-120-(i-1)*SP]);
  let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];d+=' C'+a[0]+' '+(a[1]-46)+','+b[0]+' '+(b[1]+46)+','+b[0]+' '+b[1]}
  let html='<svg viewBox="0 0 100 '+Hh+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="16" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="'+d+'" fill="none" stroke="#ff9ad0" stroke-width="5" stroke-dasharray="1 14" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
  for(let i=0;i<22;i++){html+='<img src="'+ICON.fruit[i%6]+'" style="position:absolute;opacity:.4;width:'+(34+i%3*12)+'px;left:'+((i*37)%88)+'%;top:'+((i*173)%Hh)+'px;transform:rotate('+(i*47%60-30)+'deg)">'}
  for(let i=1;i<=NL;i++){
    const p=pts[i-1],st=save.stars[i-1]||0,lock=i>save.unlocked,cur=i===save.unlocked&&!st;
    const stars=st?'<span class="nst">'+'<b>★</b>'.repeat(st)+'<i>★</i>'.repeat(3-st)+'</span>':'';
    html+='<button class="node '+(lock?'lock':st?'done':'')+(cur?' cur':'')+'" data-n="'+i+'" style="left:'+p[0]+'%;top:'+p[1]+'px">'+(lock?'<svg width="22" height="22" viewBox="0 0 24 24"><path fill="#6a6890" d="M12 2a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V7a5 5 0 00-5-5zm-3 8V7a3 3 0 016 0v3z"/></svg>':i)+stars+'</button>';
  }
  inner.innerHTML=html;
  $('#mapStars').textContent='★ '+totalStars();
  inner.querySelectorAll('.node').forEach(b=>b.addEventListener('click',()=>{audioInit();SFX.click();const n=+b.dataset.n;if(n>save.unlocked){toast('先通关前面的关卡吧');vib(20);return}openPre(n)}));
  const sc=$('#mapScroll');const cp=pts[Math.min(save.unlocked,NL)-1];
  requestAnimationFrame(()=>{sc.scrollTop=cp[1]-sc.clientHeight*.55});
}
function goMap(){resetAsync();ended=true;busy=true;closeModals();show('map');buildMap()}
function openPre(n){
  const Lv=mkLevel(n);L=Lv;
  $('#preTitle').textContent='第 '+n+' 关';
  $('#preTip').textContent=Lv.tip||KIND_TIP[Lv.kind];
  const tmpJ=Lv.jelly?Lv.jelly.flat().filter(v=>v>0).length:0,tmpI=Lv.ice?Lv.ice.length:0;
  $('#preGoals').innerHTML=Lv.goals.map(q=>{
    if(q.k==='score')return '<div class="goal"><img src="'+ICON.star+'"><div class="n">'+fmt(q.n)+'分</div></div>';
    if(q.k==='col')return '<div class="goal"><img src="'+ICON.fruit[q.c]+'"><div class="n">×'+q.n+'</div></div>';
    if(q.k==='jelly')return '<div class="goal"><img src="'+ICON.jelly+'"><div class="n">×'+tmpJ+'</div></div>';
    return '<div class="goal"><img src="'+ICON.ice+'"><div class="n">×'+tmpI+'</div></div>';
  }).join('');
  $('#preMoves').textContent=Lv.moves+' 步';
  $('#preGo').onclick=()=>{SFX.click();startLevel(n)};
  openModal('pre');
}
const BNAME={hammer:'锤子',shuffle:'洗牌',plus:'加5步'};
function showResult(win,stars,left){
  const n=L.n;let body='',btns='';
  if(win){
    const prevBest=save.best[n-1]||0,newBest=score>prevBest;
    save.stars[n-1]=Math.max(save.stars[n-1]||0,stars);save.best[n-1]=Math.max(prevBest,score);
    if(save.unlocked<=n&&n<NL)save.unlocked=n+1;
    const ks=Object.keys(BNAME);const rw=[ks[irand(3)]];if(stars===3)rw.push(ks[irand(3)]);
    rw.forEach(k=>save.boost[k]++);persist();
    $('#resTitle').textContent=stars===3?'完美通关！':'通关成功！';
    $('#resStars').style.display='flex';$('#resStars').innerHTML=[0,1,2].map(()=>starSVG(false)).join('');
    [0,1,2].forEach(i=>{if(i<stars)setTimeout(()=>{const s=$('#resStars').children[i];if(!s)return;s.outerHTML=starSVG(true);$('#resStars').children[i].classList.add('on');SFX.star(i);vib(30)},450+i*420)});
    const cnt={};rw.forEach(k=>cnt[k]=(cnt[k]||0)+1);
    body='<div class="score-big">'+fmt(score)+'</div><p>'+(newBest&&prevBest?'<b style="color:#ffe55c">新纪录！</b> ':'')+'最高连消 ×'+maxChain+(left?' · 剩余步数 '+left:'')+'</p><div class="reward">获得道具：'+Object.keys(cnt).map(k=>BNAME[k]+' +'+cnt[k]).join('、')+'</div>'+(n===NL?'<p style="color:#ffe55c;font-weight:900">恭喜你！已通关全部 36 关 🎉</p>'.replace(' 🎉','！'):'');
    btns=(n<NL?'<button class="btn green" id="rNext">下一关</button>':'')+'<button class="btn blue sm" id="rRetry">再玩一次</button><button class="btn pink sm" id="rMap">返回地图</button>';
  }else{
    $('#resTitle').textContent='挑战失败';$('#resStars').style.display='none';
    const rem=L.goals.map(q=>q.k==='score'?'分数 '+fmt(score)+'/'+fmt(q.n):q.k==='col'?FR[q.c].name+' '+Math.min(collected[q.c],q.n)+'/'+q.n:q.k==='jelly'?'果冻剩余 '+jellyLeft:'冰封果剩余 '+iceLeft).join('<br>');
    body='<p style="margin-top:2px">差一点点就成功了！</p><div class="tipbox" style="text-align:center;font-weight:800">'+rem+'</div>';
    btns='<button class="btn green" id="rPlus" '+(save.boost.plus>0?'':'disabled')+'>加5步继续（剩'+save.boost.plus+'）</button><button class="btn blue sm" id="rRetry">再试一次</button><button class="btn pink sm" id="rMap">返回地图</button>';
  }
  $('#resBody').innerHTML=body;$('#resBtns').innerHTML=btns;
  const b=id=>document.getElementById(id);
  if(b('rNext'))b('rNext').onclick=()=>{SFX.click();startLevel(n+1)};
  if(b('rRetry'))b('rRetry').onclick=()=>{SFX.click();startLevel(n)};
  if(b('rMap'))b('rMap').onclick=()=>{SFX.click();goMap()};
  if(b('rPlus'))b('rPlus').onclick=()=>{SFX.boost();save.boost.plus--;persist();moves+=5;ended=false;busy=false;hintT=0;closeModals();updateHUD();updateBoostUI();floatText(VW/2,by-20,'+5 步','#aaff7a',30,1.2)};
  openModal('result');
}
function setPaused(p){paused=p;if(p){openModal('pause')}else closeModals()}

/* ========= 绑定 ========= */
function bind(){
  const sfxBtn=(id,fn)=>$('#'+id).addEventListener('click',()=>{audioInit();SFX.click();fn()});
  sfxBtn('btnPlay',()=>{show('map');buildMap()});
  const togS=()=>{save.sound=save.sound?0:1;persist();setToggleLabels();SFX.click();MUS.ensure()},togV=()=>{save.vib=save.vib?0:1;persist();setToggleLabels();vib(30)};
  ['tSound','pSound','btnSnd'].forEach(i=>$('#'+i).addEventListener('click',()=>{audioInit();togS()}));
  ['tVib','pVib'].forEach(i=>$('#'+i).addEventListener('click',togV));
  ['tMusic','pMusic'].forEach(i=>$('#'+i).addEventListener('click',()=>{audioInit();save.music=save.music===0?1:0;persist();setToggleLabels();MUS.ensure();SFX.click()}));
  let rc=0;$('#tReset').addEventListener('click',()=>{audioInit();if(rc){save=defSave();persist();rc=0;$('#tReset').textContent='清除存档';buildTitle();setToggleLabels();toast('存档已清除')}else{rc=1;$('#tReset').textContent='再点一次确认';setTimeout(()=>{rc=0;$('#tReset').textContent='清除存档'},2500)}});
  sfxBtn('mapBack',()=>{show('title');buildTitle()});
  sfxBtn('preBack',()=>closeModals());
  sfxBtn('btnPause',()=>{if(!ended)setPaused(true)});
  sfxBtn('pResume',()=>setPaused(false));
  sfxBtn('pRestart',()=>startLevel(L.n));
  sfxBtn('pQuit',()=>goMap());
  $('#bHammer').addEventListener('click',()=>useBoost('hammer'));
  $('#bShuffle').addEventListener('click',()=>useBoost('shuffle'));
  $('#bPlus').addEventListener('click',()=>useBoost('plus'));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='game'&&!ended&&!paused)setPaused(true)});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&screen==='game'&&!ended)setPaused(!paused)});
  document.addEventListener('contextmenu',e=>e.preventDefault());
}
function boot(){
  ICON={star:iconURL('star'),jelly:iconURL('jelly'),ice:iconURL('ice'),fruit:FR.map((_,i)=>iconURL('fruit',i))};
  bind();buildTitle();setToggleLabels();
  let last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!paused){if(FAST){for(let i=0;i<25;i++)update(.02)}else update(dt)}
    if(screen==='game')draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
