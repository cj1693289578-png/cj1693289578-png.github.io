<script>
(()=>{
'use strict';
/* ====================== 工具 ====================== */
const TAU=Math.PI*2, rnd=Math.random, rr=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif';
const $=id=>document.getElementById(id);
const OUT='#1a0f24';
const fmtTime=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const RUN_LEN=600; // 10 分钟
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayIndex=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)};

/* ====================== 存档 ====================== */
const SAVE_KEY='yeren_kuangchao_v1';
let save={coins:80,up:{},best:{time:0,kills:0,level:0,win:0,combo:0},runs:0,sound:true,music:true,vibe:true,q:'auto',diff:0,diffMax:0,char:'hero',chars:{hero:1},ach:{},daily:{day:'',d5:0,d10:0},stats:{kills:0,earned:0,deaths:0,wins:0,evos:0}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s){
 for(const k in s){if(typeof s[k]==='object'&&s[k]&&!Array.isArray(s[k])&&save[k]&&typeof save[k]==='object')Object.assign(save[k],s[k]);else save[k]=s[k]}
}}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

const META=[
 {id:'atk',name:'攻击强化',max:10,base:60,desc:l=>`所有伤害 +${l*6}%`,icon:'knife'},
 {id:'hp',name:'体魄强化',max:10,base:50,desc:l=>`最大生命 +${l*12}`,icon:'heart'},
 {id:'spd',name:'疾行',max:8,base:60,desc:l=>`移动速度 +${l*3}%`,icon:'boots'},
 {id:'mag',name:'磁力',max:8,base:45,desc:l=>`拾取范围 +${l*12}%`,icon:'magnet'},
 {id:'xp',name:'悟性',max:10,base:80,desc:l=>`经验获取 +${l*6}%`,icon:'gem'},
 {id:'arm',name:'护甲',max:5,base:140,desc:l=>`受到的伤害 -${l}`,icon:'shield'},
 {id:'gold',name:'贪婪',max:8,base:70,desc:l=>`金币获取 +${l*10}%`,icon:'coin'},
 {id:'rer',name:'好运连连',max:3,base:200,desc:l=>`每局升级重抽次数 +${l}`,icon:'dice'},
 {id:'crt',name:'暴击精通',max:5,base:160,desc:l=>`暴击率 +${l*2}%`,icon:'clover'},
 {id:'ara',name:'扩张',max:5,base:150,desc:l=>`武器范围 +${l*4}%`,icon:'scroll'},
 {id:'rev',name:'涅槃重生',max:2,base:500,desc:l=>`每局可复活 ${l} 次`,icon:'phoenix'},
];
const metaLv=id=>save.up[id]||0;
const metaCost=m=>Math.round(m.base*Math.pow(1.5,metaLv(m.id))/5)*5;

/* ====================== 程序化美术 ====================== */
const SS=2,PAD=2;
function mk(w,h,fn){const c=document.createElement('canvas');c.width=Math.ceil(w*SS);c.height=Math.ceil(h*SS);const g=c.getContext('2d');g.scale(SS,SS);fn(g,w,h);return c}
function flashOf(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#fff';g.globalAlpha=.9;g.fillRect(0,0,f.width,f.height);return f}
function tintOf(c,col,a){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-atop';g.fillStyle=col;g.globalAlpha=a;g.fillRect(0,0,f.width,f.height);return f}
function flipOf(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.translate(f.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f}
const ell=(g,x,y,rx,ry,fill,stroke,lw)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1.4;g.stroke()}};
const poly=(g,pts,fill,stroke,lw)=>{g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1.4;g.lineJoin='round';g.stroke()}};
const eye=(g,x,y,r,pc,look)=>{ell(g,x,y,r,r*1.1,'#fff',OUT,.8);ell(g,x+(look||0),y+.2,r*.55,r*.65,pc||'#111');ell(g,x+(look||0)-r*.2,y-r*.2,r*.2,r*.2,'#fff')};
function grad(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>gr.addColorStop(i/(stops.length-1),s));return gr}
function glowBall(g,cx,cy,r,c0,c1,c2){const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,c0);gr.addColorStop(.35,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,TAU);g.fill()}
function haloSprite(rgb,size){return mk(size,size,(g)=>{const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);gr.addColorStop(0,`rgba(${rgb},.85)`);gr.addColorStop(.4,`rgba(${rgb},.3)`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(0,0,size,size)})}

// 统一后处理：体积光影 + 外描边
function shadeCanvas(c,k){const g=c.getContext('2d');g.globalCompositeOperation='source-atop';
 let gr=g.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,`rgba(255,255,255,${.26*k})`);gr.addColorStop(.45,'rgba(255,255,255,0)');gr.addColorStop(1,`rgba(10,0,40,${.34*k})`);g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
 gr=g.createRadialGradient(c.width*.32,c.height*.28,0,c.width*.32,c.height*.28,c.width*.6);gr.addColorStop(0,`rgba(255,255,255,${.12*k})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);return c}
function outlineCanvas(c,col,th){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const g=o.getContext('2d');
 const s=tintOf(c,col||'#10061a',1);const t=(th||1.3)*SS;
 for(let i=0;i<10;i++){const a=i/10*TAU;g.drawImage(s,Math.cos(a)*t,Math.sin(a)*t)}
 g.drawImage(c,0,0);return o}
function mkSprite(w,h,fn,k){const base=mk(w+2*PAD,h+2*PAD,(g)=>{g.translate(PAD,PAD);fn(g,w,h)});return outlineCanvas(shadeCanvas(base,k===undefined?1:k))}

// ---- 角色/敌人精灵：4 帧行走循环 ----
const ph4=f=>f/4*TAU;
function drawBat(g,w,h,f){const cx=w/2,cy=h/2+2,s=Math.sin(ph4(f)),wy=s*7;g.lineJoin='round';
 for(const sd of[-1,1]){g.beginPath();g.moveTo(cx+sd*3,cy-2);g.quadraticCurveTo(cx+sd*12,cy-8+wy,cx+sd*15,cy+wy*.5);g.lineTo(cx+sd*11.5,cy+1+wy*.4);g.lineTo(cx+sd*9,cy+4+wy*.25);g.lineTo(cx+sd*6.5,cy+1.5);g.lineTo(cx+sd*5,cy+3);g.closePath();g.fillStyle=grad(g,cx,cy-8,cx+sd*14,cy+4,['#6a2fa0','#35105a']);g.fill();g.strokeStyle=OUT;g.lineWidth=1.2;g.stroke();
  g.strokeStyle='rgba(255,170,255,.35)';g.lineWidth=.8;g.beginPath();g.moveTo(cx+sd*4,cy-1);g.lineTo(cx+sd*13,cy+wy*.4);g.moveTo(cx+sd*4,cy);g.lineTo(cx+sd*10,cy+3+wy*.25);g.stroke()}
 poly(g,[cx-5,cy-4,cx-4,cy-11,cx-1.5,cy-5],'#a560e0',OUT,1);poly(g,[cx+5,cy-4,cx+4,cy-11,cx+1.5,cy-5],'#a560e0',OUT,1);
 ell(g,cx,cy,6.4,7,grad(g,0,cy-7,0,cy+7,['#b878f0','#6f35a8']),OUT,1.3);ell(g,cx,cy+2.6,3.6,3.2,'#d9b0f5');
 eye(g,cx-2.4,cy-1.6,1.9,'#ff1b3a');eye(g,cx+2.4,cy-1.6,1.9,'#ff1b3a');
 poly(g,[cx-2.2,cy+2.4,cx-1.2,cy+5.4,cx-.2,cy+2.4],'#fff');poly(g,[cx+.2,cy+2.4,cx+1.2,cy+5.4,cx+2.2,cy+2.4],'#fff');}
function drawZombie(g,w,h,f){const cx=w/2,cy=h/2,s=Math.sin(ph4(f)),c=Math.cos(ph4(f));g.lineJoin='round';g.strokeStyle=OUT;g.lineWidth=1.2;
 g.fillStyle='#3d4a78';g.fillRect(cx-5.4,cy+7+Math.max(0,s)*1.8,4.2,7);g.strokeRect(cx-5.4,cy+7+Math.max(0,s)*1.8,4.2,7);g.fillRect(cx+1.2,cy+7+Math.max(0,-s)*1.8,4.2,7);g.strokeRect(cx+1.2,cy+7+Math.max(0,-s)*1.8,4.2,7);
 g.fillStyle='#2a2a30';g.fillRect(cx-6,cy+13+Math.max(0,s)*1.8,5.4,2.2);g.fillRect(cx+.6,cy+13+Math.max(0,-s)*1.8,5.4,2.2);
 // 手臂前伸摇摆
 g.fillStyle='#78b856';g.fillRect(cx-13,cy-5+c*1.2,8,3.6);g.strokeRect(cx-13,cy-5+c*1.2,8,3.6);g.fillRect(cx+5,cy-5-c*1.2,8,3.6);g.strokeRect(cx+5,cy-5-c*1.2,8,3.6);
 ell(g,cx,cy+3,7.4,8.6,grad(g,0,cy-5,0,cy+11,['#7a94d0','#3f5588']),OUT,1.3);
 g.strokeStyle='#27304f';g.lineWidth=1;g.beginPath();g.moveTo(cx-4,cy+6);g.lineTo(cx-2,cy+9);g.moveTo(cx+3,cy+4);g.lineTo(cx+5,cy+7);g.stroke();
 ell(g,cx,cy-6.4+Math.abs(s)*-.6,7.8,7.2,grad(g,0,cy-14,0,cy+1,['#a8e47e','#6fae4f']),OUT,1.3);
 g.fillStyle='#e8e0c0';g.fillRect(cx-7.4,cy-9,14.8,2.4);// 绷带
 eye(g,cx-2.9,cy-6,2.1,'#c0201a',1);eye(g,cx+2.9,cy-6,2.1,'#c0201a',1);
 g.fillStyle='#3a1a1a';g.beginPath();g.moveTo(cx-3,cy-2);g.lineTo(cx+3,cy-2.2);g.lineTo(cx+2,cy-.2);g.lineTo(cx-2,cy-.1);g.fill();
 g.fillStyle='#fff';g.fillRect(cx-2,cy-2,1.2,1.1);g.fillRect(cx+.8,cy-2.1,1.2,1.1);}
function drawSkel(g,w,h,f){const cx=w/2,cy=h/2,s=Math.sin(ph4(f)),c=Math.cos(ph4(f));g.lineJoin='round';g.strokeStyle=OUT;g.lineWidth=1.2;
 g.fillStyle='#e8e2cf';g.fillRect(cx-4.5,cy+8+Math.max(0,s)*2,3,6);g.strokeRect(cx-4.5,cy+8+Math.max(0,s)*2,3,6);g.fillRect(cx+1.5,cy+8+Math.max(0,-s)*2,3,6);g.strokeRect(cx+1.5,cy+8+Math.max(0,-s)*2,3,6);
 g.fillStyle='#f4efdc';g.fillRect(cx-6,cy-1,12,10);g.strokeRect(cx-6,cy-1,12,10);
 g.strokeStyle='#8c8570';g.lineWidth=1;for(let i=0;i<3;i++){g.beginPath();g.moveTo(cx-5,cy+1.5+i*3);g.lineTo(cx+5,cy+1.5+i*3);g.stroke()}g.beginPath();g.moveTo(cx,cy-1);g.lineTo(cx,cy+9);g.stroke();
 g.strokeStyle=OUT;g.lineWidth=1.2;g.fillStyle='#e8e2cf';g.fillRect(cx-11,cy-1+c*1.2,5,2.6);g.strokeRect(cx-11,cy-1+c*1.2,5,2.6);
 g.save();g.translate(cx+9,cy-c*1.2);g.rotate(.6+s*.15);g.fillStyle='#c9a46a';g.fillRect(-1.5,-10,3,12);g.strokeRect(-1.5,-10,3,12);poly(g,[-3,-10,3,-10,2,-15,-2,-15],'#b8bcc8',OUT,1);g.restore();
 ell(g,cx,cy-7,7.4,6.9,grad(g,0,cy-14,0,cy,['#fffaf0','#e0d9c0']),OUT,1.3);g.fillStyle='#f4efdc';g.fillRect(cx-3.5,cy-3,7,4);g.strokeRect(cx-3.5,cy-3,7,4);
 ell(g,cx-2.8,cy-7,2.2,2.6,'#1a0f24');ell(g,cx+2.8,cy-7,2.2,2.6,'#1a0f24');ell(g,cx-2.8,cy-7,.9,.9,'#ff4a3a');ell(g,cx+2.8,cy-7,.9,.9,'#ff4a3a');
 poly(g,[cx-1,cy-4.2,cx+1,cy-4.2,cx,cy-2.8],'#1a0f24');g.strokeStyle=OUT;g.lineWidth=.8;for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(cx+i*2,cy-2.5);g.lineTo(cx+i*2,cy);g.stroke()}
 g.beginPath();g.moveTo(cx-7.4,cy-8);g.quadraticCurveTo(cx,cy-17,cx+7.4,cy-8);g.lineTo(cx+6,cy-9.5);g.quadraticCurveTo(cx,cy-13,cx-6,cy-9.5);g.closePath();g.fillStyle='#7a7f90';g.fill();g.strokeStyle=OUT;g.lineWidth=1;g.stroke();}
function drawSlime(g,w,h,f){const cx=w/2,cy=h/2+4,s=Math.sin(ph4(f)),sq=1+s*.09;g.save();g.translate(cx,cy+9);g.scale(1/sq,sq);g.translate(-cx,-(cy+9));
 g.beginPath();g.moveTo(cx-14,cy+9);g.bezierCurveTo(cx-15,cy-6,cx-7,cy-14,cx,cy-14);g.bezierCurveTo(cx+7,cy-14,cx+15,cy-6,cx+14,cy+9);g.quadraticCurveTo(cx,cy+12,cx-14,cy+9);g.closePath();
 g.fillStyle=grad(g,0,cy-14,0,cy+10,['#9af4ff','#2bb0e0','#1a78c0']);g.fill();g.strokeStyle=OUT;g.lineWidth=1.6;g.lineJoin='round';g.stroke();
 ell(g,cx-6,cy-7,3.6,2.1,'rgba(255,255,255,.75)');ell(g,cx+7,cy+3,1.6,1.6,'rgba(255,255,255,.4)');ell(g,cx+4,cy+6,1,1,'rgba(255,255,255,.4)');ell(g,cx-9,cy+4,1.2,1.2,'rgba(255,255,255,.35)');
 eye(g,cx-4.2,cy-1,2.8,'#124',0);eye(g,cx+4.2,cy-1,2.8,'#124',0);
 g.strokeStyle=OUT;g.lineWidth=1.2;g.beginPath();g.arc(cx,cy+3.8,2.6,.1,Math.PI-.1);g.stroke();g.restore();}
function drawDemon(g,w,h,f){const cx=w/2,cy=h/2+1,s=Math.sin(ph4(f)),c=Math.cos(ph4(f));g.lineJoin='round';
 for(const sd of[-1,1]){const wy=s*4;poly(g,[cx+sd*4,cy-3,cx+sd*16,cy-10+wy,cx+sd*13,cy-2+wy,cx+sd*16,cy+3+wy,cx+sd*10,cy+3,cx+sd*5,cy+5],'#5b1450',OUT,1.3);g.strokeStyle='rgba(255,100,200,.4)';g.lineWidth=.8;g.beginPath();g.moveTo(cx+sd*5,cy-1);g.lineTo(cx+sd*14,cy-6+wy);g.moveTo(cx+sd*5,cy+1);g.lineTo(cx+sd*12,cy+1+wy);g.stroke()}
 g.strokeStyle=OUT;g.lineWidth=2.6;g.beginPath();g.moveTo(cx,cy+9);g.quadraticCurveTo(cx+8+c*3,cy+13,cx+10+c*2,cy+6);g.stroke();g.strokeStyle='#c4262f';g.lineWidth=1.3;g.stroke();poly(g,[cx+8+c*2,cy+6,cx+12+c*2,cy+3,cx+12+c*2,cy+8],'#c4262f',OUT,1);

function recalc(){
 const p=k=>passLv[k]||0;
 S.area=(1+.12*p('area'))*(1+.04*metaLv('ara'))*(1+(curChar.area||0));
 S.crit=.08+.06*p('luck')+.02*metaLv('crt')+(curChar.crit||0);
 S.might=(1+.15*p('power'))*(1+.06*metaLv('atk'))*(1+curChar.might)*(MOD.might||1);
 S.speed=130*(1+.1*p('boots'))*(1+.03*metaLv('spd'))*(1+curChar.speed)*(MOD.pspd||1);
 S.magnet=64*(1+.35*p('magnet'))*(1+.12*metaLv('mag'))*(1+curChar.mag);
 const oldMax=S.maxHp||0;
 S.maxHp=Math.round((100+20*p('heart')+12*metaLv('hp')+curChar.hp)*(MOD.php||1));
 S.regen=.4*p('heart')+(curChar.regen||0);
 S.cd=Math.max(.45,1-.08*p('haste')-curChar.cd);
 S.armor=metaLv('arm')+curChar.armor+p('armor');
 S.xp=(1+.06*metaLv('xp'))*(1+.12*p('growth'))*(MOD.xp||1);
 S.gold=(1+.1*metaLv('gold'))*(MOD.coin||1);
 if(oldMax&&S.maxHp>oldMax)hp+=S.maxHp-oldMax;
}
const xpNeed=l=>Math.round(4+(l-1)*3.8+(l-1)*(l-1)*.7);

function hpMul(){const m=t/60;return 1+m*.35+m*m*.085}
function spawnEnemy(type,x,y){
 if(ecount>=MAXE)return null;
 const d=ET[type],e=E[ecount++];
 if(x===undefined){const a=rnd()*TAU,R=Math.hypot(viewW,viewH)/2+rr(25,90);x=px+Math.cos(a)*R;y=py+Math.sin(a)*R}
 const m=t/60,hm=d.boss?1:hpMul();
 e.id=idN++;e.type=type;e.x=x;e.y=y;e.r=d.r;e.hp=e.maxHp=d.hp*hm*(d.boss?(1+((MOD.ehp||1)-1)*.6):(MOD.ehp||1));e.spd=d.spd*(1+Math.min(.25,m*.02))*(d.boss||d.elite?1:rr(.92,1.08))*(MOD.espd||1);e.dmg=d.dmg*(1+m*.09)*(MOD.edmg||1);e.xp=d.xp;e.col=d.col;e.kbm=d.kb;
 e.kx=e.ky=0;e.flash=0;e.orbCd=0;e.slow=0;e.freeze=0;e.anim=rnd()*3;e.state=0;e.st=0;e.boss=!!d.boss;e.elite=!!d.elite;e.mk=0;e.lx=0;e.ly=0;e.ph=rnd()*TAU;e.sp=SPR[d.spr||type];e.sc=d.sc||1;e.dead=0;e.sq=0;e.nc=!!d.nocontact;
 return e;
}
function spawnItem(type,x,y,v){
 if(type===0&&IT.length>=MAXIT){for(let i=0;i<IT.length;i++)if(IT[i].type===0){IT[i].v+=v;return}return}
 if(IT.length>=MAXIT+40)return;
 IT.push({type,x,y,v,mag:false,ph:rnd()*TAU,vx:rr(-40,40),vy:rr(-40,40),ox:x,oy:y,msp:0});
}
function addParticle(x,y,vx,vy,life,size,col,type,drag,grav){

/* ---- 升级选择 ---- */
const RAR={common:'普通',rare:'稀有',epic:'史诗',legend:'传说'};
function evoAvailable(){return WORDER.filter(id=>wl[id]===6&&passLv[EVOS[id].need]>0)}
function upgradeOptions(){
 const pool=[];let nW=0,nP=0;for(const id of WORDER)if(wl[id])nW++;for(const id of PORDER)if(passLv[id])nP++;
 for(const id of WORDER){const W=WEAPONS[id],l=wl[id]||0;if(l>=6)continue;if(!l&&nW>=MAXW)continue;
  pool.push({k:'w',id,icon:W.icon,name:W.name,tag:l?`Lv.${l} → ${l+1}`:'新武器',up:!!l,desc:W.lv[l].t,rar:l?'rare':'epic',wgt:l?1:(t<120?1.8:1.2)})}
 for(const id of PORDER){const P=PASSIVES[id],l=passLv[id]||0;if(l>=P.max)continue;if(!l&&nP>=MAXP)continue;
  const enab=WORDER.find(w=>EVOS[w].need===id&&wl[w]===6);
  pool.push({k:'p',id,icon:P.icon,name:P.name,tag:enab&&!l?'可进化！':(l?`Lv.${l} → ${l+1}`:'新道具'),up:!!l,desc:P.desc+(enab&&!l?`（解锁「${EVOS[enab].name}」）`:''),rar:l?'common':'rare',wgt:enab&&!l?4:1})}
 return pool;
}
function pickN(pool,n){const out=[];pool=pool.slice();while(out.length<n&&pool.length){let sum=0;for(const c of pool)sum+=c.wgt||1;let r=rnd()*sum,k=0;for(;k<pool.length;k++){r-=pool[k].wgt||1;if(r<=0)break}k=Math.min(k,pool.length-1);out.push(pool.splice(k,1)[0])}return out}
const FALLBACK=[{k:'x',id:'heal',icon:'chicken',name:'烤鸡大餐',tag:'',desc:'立刻回复 40% 最大生命',rar:'common'},{k:'x',id:'gold',icon:'bag',name:'金币袋',tag:'',desc:'获得 60 枚金币',rar:'common'}];
function evoCard(id){const E2=EVOS[id];return{k:'e',id,icon:E2.icon,name:E2.name,tag:'武器进化',evo:1,desc:WEAPONS[id].lv[6].t,rar:'legend'}}
function buildChoices(){
 const out=evoAvailable().slice(0,2).map(evoCard);
 pickN(upgradeOptions(),3-out.length).forEach(c=>out.push(c));
 let fi=0;while(out.length<3)out.push(FALLBACK[fi++%2]);
 return out;
}
function cardHTML(c){return `<img class="ic" src="${ICON_URL[c.icon]}"><div class="rr">${RAR[c.rar]}</div><div class="tx"><div class="nm">${c.name}${c.tag?`<span class="tg ${c.evo?'evo':c.up?'up':''}">${c.tag}</span>`:''}</div><div class="ds">${c.desc}</div></div>`}

 const box=$('cards');box.innerHTML='';
 choices.forEach((c,i)=>{const d=document.createElement('div');d.className='card r-'+c.rar;d.innerHTML=cardHTML(c);d.onclick=()=>choose(i);box.appendChild(d)});
 $('btnReroll').textContent='重新抽取（剩 '+rerolls+'）';$('btnReroll').disabled=rerolls<=0;
}

function applyChoice(c){
 if(c.k==='w'){const l=(wl[c.id]||0)+1;wl[c.id]=l;if(l===1)wt[c.id]=.2}
 else if(c.k==='p'){passLv[c.id]=(passLv[c.id]||0)+1;recalc()}

 wl[id]=7;wt[id]=.1;runEvos++;save.stats.evos++;
 sfx('evolve');vib([40,30,40,30,120]);addShake(14);addHitStop(.32);addFlash(1,'255,235,160');
 showBanner('武器进化！'+EVOS[id].name,3.2,'#ffe36a');
 for(let i=0;i<3;i++)FX.push({k:'ring',x:px,y:py,r:8,max:220+i*160,life:.7+i*.18,t:0,col:i?'255,200,70':'255,255,200'});
 FX.push({k:'glow',x:px,y:py,r:220,life:.9,t:0,col:'gold'});
 burst(px,py,70,'#ffe36a',320,1.1,5,2);burst(px,py,30,'#fff',240,.9,3,2);
}
function choose(i){
 if(state!=='levelup')return;const c=choices[i];if(!c)return;
 applyChoice(c);sfx('pick');pending--;hideAll();state='playing';musVolume(.5);
 if(pending>0)openLevelUp();
}
function rerollCards(){if(state!=='levelup'||rerolls<=0)return;rerolls--;sfx('click');vib(10);choices=buildChoices();renderCards()}
function skipLevel(){if(state!=='levelup')return;hp=Math.min(S.maxHp,hp+S.maxHp*.1);coinsRun+=10;pending--;hideAll();state='playing';musVolume(.5);const d=dmgNum(px,py-30,0,false,'#ffe36a');if(d)d.txt='跳过：回血 +10金币';if(pending>0)openLevelUp()}
/* ---- 宝箱 ---- */
let chestTO=[],chestStage=0;
function openChest(){
 state='chest';joy.on=false;chestStage=0;vib([20,30,20]);sfx('chest');musVolume(.22);
 const evos=evoAvailable();
 if(evos.length)chestReward=[evoCard(evos[0])];
 else{chestReward=pickN(upgradeOptions(),3);if(!chestReward.length)chestReward=[FALLBACK[0],FALLBACK[1]]}
 $('chestTitle').textContent='发现宝箱！';$('chestImg').src=CHEST_BIG[0];$('chestWrap').className='chestwrap shake';$('chestCards').innerHTML='';$('btnChestOk').style.display='none';$('chestHint').style.display='block';
 show('chest');
 chestTO.forEach(clearTimeout);chestTO=[setTimeout(chestOpen,1250)];
}
function chestOpen(){
 if(chestStage>=1)return;chestStage=1;chestTO.forEach(clearTimeout);
 $('chestImg').src=CHEST_BIG[1];$('chestWrap').className='chestwrap open';sfx('chestopen');vib([30,20,60]);
 const isEvo=chestReward[0].k==='e';$('chestTitle').textContent=isEvo?'传说奖励！武器进化':'宝箱奖励';
 chestTO=[setTimeout(()=>{
  const box=$('chestCards');box.innerHTML='';
  chestReward.forEach((c,i)=>{const d=document.createElement('div');d.className='card static r-'+c.rar;d.style.animationDelay=(i*.18)+'s';d.innerHTML=cardHTML(c);box.appendChild(d)});
  $('chestHint').style.display='none';chestStage=2;
  chestTO=[setTimeout(()=>{$('btnChestOk').style.display='block'},350+chestReward.length*180)];
 },650)];
}
function chestSkip(){if(state!=='chest')return;if(chestStage===0)chestOpen()}
function chestClose(){
 if(state!=='chest'||chestStage<2)return;chestTO.forEach(clearTimeout);
 hideAll();state='playing';musVolume(.5);
 chestReward.forEach(applyChoice);sfx('pick');
}

/* ====================== 输入 ====================== */
const JR=56;
canvas.addEventListener('pointerdown',e=>{audio();if(state!=='playing'||joy.on)return;e.preventDefault();joy.on=true;joy.id=e.pointerId;joy.ox=e.offsetX;joy.oy=e.offsetY;joy.dx=joy.dy=0;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;let dx=e.offsetX-joy.ox,dy=e.offsetY-joy.oy;const d=Math.hypot(dx,dy);
 if(d>JR){const k=(d-JR)/d;joy.ox+=dx*k;joy.oy+=dy*k;dx=e.offsetX-joy.ox;dy=e.offsetY-joy.oy}
 const dd=Math.hypot(dx,dy);if(dd<6){joy.dx=joy.dy=0}else{joy.dx=dx/JR;joy.dy=dy/JR}});
const endJoy=e=>{if(e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0}};
canvas.addEventListener('pointerup',endJoy);canvas.addEventListener('pointercancel',endJoy);
document.addEventListener('pointerdown',()=>{audio();if(ac&&save.music&&musMode==='off'&&state==='menu')setMusic('menu')},{passive:true});
window.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 if(e.code==='Escape'||e.code==='KeyP'){if(state==='playing')pauseGame();else if(state==='paused')resumeGame()}
 if(state==='levelup'){if(e.code==='Digit1'||e.code==='Numpad1')choose(0);if(e.code==='Digit2'||e.code==='Numpad2')choose(1);if(e.code==='Digit3'||e.code==='Numpad3')choose(2);if(e.code==='KeyR')rerollCards()}
 if(state==='chest'){if(e.code==='Space'||e.code==='Enter'){chestStage<2?chestSkip():chestClose()}}
 if(state==='menu'&&(e.code==='Enter'||e.code==='Space'))startRun(false);
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='playing')pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='playing')pauseGame();if(ac&&ac.state==='running')ac.suspend().catch(()=>{});releaseWake()}else{if(ac&&save.sound)ac.resume().catch(()=>{});last=performance.now();accDt=0}});
window.addEventListener('pagehide',()=>{if(state==='playing')pauseGame();persist()});
window.addEventListener('orientationchange',()=>{setTimeout(resize,250);setTimeout(resize,700)});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{clearTimeout(resize.h);resize.h=setTimeout(resize,120)});
/* 屏幕常亮（对局中） */
let wake=null;
function requestWake(){try{if(navigator.wakeLock&&!wake){navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>{wake=null})}).catch(()=>{})}}catch(e){}}
function releaseWake(){try{if(wake){wake.release();wake=null}}catch(e){}}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button,.card'))sfx('click')});
window.addEventListener('resize',()=>{clearTimeout(resize.h);resize.h=setTimeout(resize,60)});
$('btnDiff').onclick=()=>{if(!save.diffMax){toast('通关一次即可解锁「噩梦」难度');return}save.diff=((save.diff||0)+1)%(save.diffMax+1);persist();sfx('click');refreshMenu()};
$('btnStart').onclick=()=>startRun(false);$('btnDaily').onclick=()=>startRun(true);$('btnAgain').onclick=()=>startRun(isDaily);$('btnRestart').onclick=()=>startRun(isDaily);
$('btnMeta').onclick=openMeta;$('btnMeta2').onclick=openMeta;$('btnMetaBack').onclick=goMenu;$('btnHome').onclick=goMenu;
$('btnChars').onclick=openChars;$('btnCharsBack').onclick=goMenu;$('btnAch').onclick=openAch;$('btnAchBack').onclick=goMenu;
$('btnResume').onclick=resumeGame;$('btnQuit').onclick=quitRun;$('pauseBtn').onclick=pauseGame;
$('btnReroll').onclick=rerollCards;$('btnSkip').onclick=skipLevel;$('btnChestOk').onclick=chestClose;$('chest').addEventListener('click',e=>{if(e.target.id!=='btnChestOk')chestSkip()});
const togg=k=>()=>{save[k]=!save[k];persist();audio();refreshToggles();
 if(k==='music')refreshMusic();
 if(k==='vibe'&&save.vibe)vib(30)};
const cycleQ=()=>{const o=['auto','high','mid','low'];save.q=o[(o.indexOf(save.q||'auto')+1)%4];persist();ql=0;resize();refreshToggles()};$('btnQual').onclick=cycleQ;$('btnQualP').onclick=cycleQ;
$('btnSound').onclick=togg('sound');$('btnSoundP').onclick=togg('sound');$('btnMusic').onclick=togg('music');$('btnMusicP').onclick=togg('music');$('btnVibe').onclick=togg('vibe');$('btnVibeP').onclick=togg('vibe');



/* ====================== 主循环 ====================== */
let last=performance.now(),fpsAcc=0,fpsN=0,accDt=0,govN=0,govSum=0,govCool=3;
function frame(ts){
 requestAnimationFrame(frame);
 let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=1/60;
 // 高刷屏限帧到 ~60fps，省电降发热
 accDt+=dt;if(accDt<.0155)return;dt=accDt;accDt=0;
 // 画质自动档：统计真实帧间隔，持续卡顿则降一档分辨率/粒子上限
 if((save.q||'auto')==='auto'&&state==='playing'&&!document.hidden){if(govCool>0)govCool-=dt;else{govN++;govSum+=dt;if(govN>=90){const avg=govSum/govN;govN=0;govSum=0;if(avg>.026&&ql<2){ql++;resize();govCool=4}}}}else{govN=0;govSum=0}
 if(dt>1/30)dt=1/30;
 menuT+=dt;
 
 if(state==='playing'){update(dt)}
 else if(state==='dying'){updateFx(dt);dyingT-=dt;if(dyingT<=0)showOver(false)}
 else if(state==='levelup'||state==='chest'||state==='paused'||state==='over'){updateFx(dt*.3)}
 musicTick();
 if(location.search.indexOf('debug')>=0){fpsAcc+=dt;fpsN++;if(fpsAcc>=1){document.title='FPS '+fpsN+' E'+ecount;fpsAcc=0;fpsN=0}}
 render();
}
resize();refreshMenu();
requestAnimationFrame(frame);
})();
</script></body></html>
